<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MY STORE</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 18px;
            font-family: Arial, sans-serif;
            background: #09090b;
            color: #f5f5f7;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 22px;
        }

        .brand {
            min-width: 0;
        }

        .brand-title {
            margin: 0;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .brand-subtitle {
            margin-top: 4px;
            color: #85858d;
            font-size: 10px;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-button {
            position: relative;
            width: 44px;
            height: 44px;
            border: 1px solid #24242b;
            border-radius: 13px;
            background: #111115;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        .icon-button:hover {
            border-color: #7c3aed;
        }

        .icon-button:active {
            transform: scale(0.94);
        }

        .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            min-width: 19px;
            height: 19px;
            padding: 0 5px;
            border-radius: 20px;
            background: #a855f7;
            color: #fff;
            font-size: 10px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.5);
        }

        .cart-count.bump {
            animation: cartBump 0.35s ease;
        }

        @keyframes cartBump {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.35);
            }

            100% {
                transform: scale(1);
            }
        }

        /* =========================
           SEARCH
        ========================= */

        .search-wrapper {
            display: none;
            margin-bottom: 16px;
        }

        .search-wrapper.active {
            display: block;
            animation: fadeDown 0.2s ease;
        }

        .search-input {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            border: 1px solid #292932;
            border-radius: 14px;
            outline: none;
            background: #111115;
            color: #fff;
            font-size: 15px;
        }

        .search-input::placeholder {
            color: #6f6f78;
        }

        .search-input:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
        }

        /* =========================
           CATEGORIES
        ========================= */

        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            margin-bottom: 16px;
            scrollbar-width: none;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .category {
            flex: 0 0 auto;
            padding: 10px 15px;
            border: 1px solid #27272f;
            border-radius: 12px;
            background: #111115;
            color: #a1a1aa;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .category:hover {
            border-color: #7c3aed;
            color: #fff;
        }

        .category.active {
            border-color: #8b5cf6;
            background: #7c3aed;
            color: #fff;
            box-shadow: 0 0 18px rgba(124, 58, 237, 0.22);
        }

        /* =========================
           SORT
        ========================= */

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            gap: 10px;
        }

        .products-count {
            color: #777780;
            font-size: 12px;
        }

        .sort-select {
            height: 36px;
            padding: 0 10px;
            border: 1px solid #292932;
            border-radius: 10px;
            outline: none;
            background: #111115;
            color: #bdbdc5;
            font-size: 12px;
        }

        /* =========================
           PRODUCTS
        ========================= */

        .products {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .product {
            position: relative;
            min-width: 0;
            overflow: hidden;
            border: 1px solid #202027;
            border-radius: 16px;
            background: #101014;
            cursor: pointer;
            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                opacity 0.25s ease;
            animation: productAppear 0.4s ease both;
        }

        .product:hover {
            transform: translateY(-3px);
            border-color: #393943;
        }

        .product.sold-out {
            cursor: default;
        }

        .product-image-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 0.82;
            overflow: hidden;
            background: #17171c;
        }

        .product img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            transition: transform 0.35s ease, opacity 0.25s ease;
        }

        .product:hover img {
            transform: scale(1.035);
        }

        .product.sold-out img {
            opacity: 0.38;
            filter: grayscale(0.3);
        }

        .stock-badge {
            position: absolute;
            top: 9px;
            left: 9px;
            padding: 6px 8px;
            border-radius: 8px;
            background: rgba(9, 9, 11, 0.82);
            backdrop-filter: blur(8px);
            color: #d4d4d8;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .stock-badge.low {
            color: #f0abfc;
        }

        .stock-badge.out {
            background: rgba(24, 24, 27, 0.92);
            color: #a1a1aa;
        }

        .sale-badge {
            position: absolute;
            top: 9px;
            right: 9px;
            padding: 6px 8px;
            border-radius: 8px;
            background: #a855f7;
            color: #fff;
            font-size: 9px;
            font-weight: 900;
        }

        .sold-out-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .sold-out-overlay span {
            padding: 9px 12px;
            border: 1px solid rgba(255,255,255,0.16);
            border-radius: 10px;
            background: rgba(9, 9, 11, 0.82);
            backdrop-filter: blur(8px);
            color: #f4f4f5;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .product-info {
            padding: 11px;
        }

        .product-name {
            margin: 0 0 7px;
            overflow: hidden;
            color: #f4f4f5;
            font-size: 14px;
            font-weight: 800;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .product-price-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 7px;
        }

        .product-price {
            color: #fff;
            font-size: 15px;
            font-weight: 900;
        }

        .old-price {
            color: #66666f;
            font-size: 11px;
            text-decoration: line-through;
        }

        /* =========================
           SKELETON
        ========================= */

        .skeleton {
            overflow: hidden;
            border-radius: 16px;
            background: #111115;
            border: 1px solid #202027;
        }

        .skeleton-image {
            aspect-ratio: 0.82;
            background: linear-gradient(
                90deg,
                #141419 25%,
                #1b1b21 50%,
                #141419 75%
            );
            background-size: 200% 100%;
            animation: skeletonLoading 1.2s infinite;
        }

        .skeleton-line {
            height: 11px;
            margin: 12px;
            border-radius: 6px;
            background: linear-gradient(
                90deg,
                #141419 25%,
                #1b1b21 50%,
                #141419 75%
            );
            background-size: 200% 100%;
            animation: skeletonLoading 1.2s infinite;
        }

        .skeleton-line.short {
            width: 45%;
            margin-top: 0;
        }

        @keyframes skeletonLoading {
            from {
                background-position: 200% 0;
            }

            to {
                background-position: -200% 0;
            }
        }

        @keyframes productAppear {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           EMPTY SEARCH
        ========================= */

        .empty-search {
            display: none;
            padding: 55px 20px;
            text-align: center;
        }

        .empty-search.show {
            display: block;
            animation: fadeDown 0.25s ease;
        }

        .empty-search-icon {
            margin-bottom: 12px;
            font-size: 42px;
        }

        .empty-search-title {
            margin-bottom: 7px;
            font-size: 18px;
            font-weight: 900;
        }

        .empty-search-text {
            color: #71717a;
            font-size: 13px;
            line-height: 1.5;
        }

        /* =========================
           MODALS
        ========================= */

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            align-items: flex-end;
            justify-content: center;
            padding: 12px;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(7px);
        }

        .modal-backdrop.active {
            display: flex;
            animation: fadeIn 0.2s ease;
        }

        .modal {
            width: 100%;
            max-width: 560px;
            max-height: 92vh;
            overflow-y: auto;
            border: 1px solid #292932;
            border-radius: 22px;
            background: #101014;
            box-shadow: 0 20px 70px rgba(0,0,0,0.5);
            animation: modalUp 0.25s ease;
        }

        .modal-header {
            position: sticky;
            top: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 16px;
            border-bottom: 1px solid #202027;
            background: rgba(16, 16, 20, 0.94);
            backdrop-filter: blur(12px);
        }

        .modal-title {
            margin: 0;
            font-size: 17px;
            font-weight: 900;
        }

        .close-button {
            width: 34px;
            height: 34px;
            border: 1px solid #292932;
            border-radius: 10px;
            background: #17171c;
            color: #aaaab2;
            font-size: 18px;
            cursor: pointer;
        }

        /* =========================
           PRODUCT DETAIL
        ========================= */

        .gallery {
            position: relative;
            overflow: hidden;
            background: #08080a;
        }

        .gallery-track {
            display: flex;
            transition: transform 0.3s ease;
            touch-action: pan-y;
        }

        .gallery-slide {
            min-width: 100%;
            aspect-ratio: 0.82;
        }

        .gallery-slide img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        .gallery-arrow {
            position: absolute;
            top: 50%;
            z-index: 2;
            width: 38px;
            height: 38px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 50%;
            background: rgba(0,0,0,0.45);
            color: #fff;
            cursor: pointer;
            transform: translateY(-50%);
        }

        .gallery-arrow.prev {
            left: 12px;
        }

        .gallery-arrow.next {
            right: 12px;
        }

        .gallery-dots {
            position: absolute;
            bottom: 12px;
            left: 50%;
            display: flex;
            gap: 5px;
            transform: translateX(-50%);
        }

        .gallery-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.35);
        }

        .gallery-dot.active {
            width: 17px;
            border-radius: 10px;
            background: #fff;
        }

        .product-detail-content {
            padding: 17px;
        }

        .detail-name {
            margin: 0 0 9px;
            font-size: 23px;
            font-weight: 900;
        }

        .detail-price {
            margin-bottom: 16px;
            font-size: 20px;
            font-weight: 900;
        }

        .detail-old-price {
            margin-left: 8px;
            color: #66666f;
            font-size: 13px;
            text-decoration: line-through;
        }

        .detail-description {
            margin-bottom: 18px;
            color: #9898a1;
            font-size: 14px;
            line-height: 1.6;
        }

        .detail-stock {
            margin-bottom: 13px;
            color: #aaaab2;
            font-size: 12px;
            font-weight: 700;
        }

        .quantity-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            height: 48px;
            border: 1px solid #292932;
            border-radius: 13px;
            background: #15151a;
        }

        .quantity-control button {
            width: 42px;
            height: 100%;
            border: none;
            background: transparent;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }

        .quantity-control span {
            width: 30px;
            text-align: center;
            font-weight: 900;
        }

        .add-button {
            flex: 1;
            height: 48px;
            border: none;
            border-radius: 13px;
            background: #7c3aed;
            color: #fff;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.2s;
        }

        .add-button:hover {
            background: #8b5cf6;
        }

        .add-button:active {
            transform: scale(0.98);
        }

        .add-button:disabled {
            background: #292932;
            color: #66666f;
            cursor: not-allowed;
        }

        /* =========================
           CART
        ========================= */

        .cart-items {
            padding: 14px 16px 4px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 11px 0;
            border-bottom: 1px solid #202027;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item-image {
            width: 58px;
            height: 70px;
            flex: 0 0 58px;
            overflow: hidden;
            border-radius: 10px;
            background: #18181d;
        }

        .cart-item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cart-item-info {
            flex: 1;
            min-width: 0;
        }

        .cart-item-name {
            margin-bottom: 4px;
            overflow: hidden;
            font-size: 13px;
            font-weight: 800;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .cart-item-price {
            color: #9a9aa3;
            font-size: 11px;
        }

        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .cart-quantity {
            display: flex;
            align-items: center;
            border: 1px solid #292932;
            border-radius: 9px;
            overflow: hidden;
        }

        .cart-quantity button {
            width: 26px;
            height: 29px;
            border: none;
            background: #17171c;
            color: #fff;
            cursor: pointer;
        }

        .cart-quantity span {
            min-width: 24px;
            text-align: center;
            font-size: 11px;
            font-weight: 900;
        }

        .remove-item {
            width: 29px;
            height: 29px;
            border: 1px solid #292932;
            border-radius: 9px;
            background: transparent;
            color: #777780;
            cursor: pointer;
        }

        .cart-empty {
            padding: 55px 20px;
            text-align: center;
        }

        .cart-empty-icon {
            margin-bottom: 10px;
            font-size: 42px;
        }

        .cart-empty-title {
            margin-bottom: 6px;
            font-size: 18px;
            font-weight: 900;
        }

        .cart-empty-text {
            color: #71717a;
            font-size: 13px;
        }

        .cart-footer {
            padding: 15px 16px 17px;
            border-top: 1px solid #202027;
        }

        .promo-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .promo-input {
            min-width: 0;
            flex: 1;
            height: 43px;
            padding: 0 12px;
            border: 1px solid #292932;
            border-radius: 11px;
            outline: none;
            background: #15151a;
            color: #fff;
            font-size: 12px;
            text-transform: uppercase;
        }

        .promo-button {
            height: 43px;
            padding: 0 14px;
            border: 1px solid #292932;
            border-radius: 11px;
            background: #17171c;
            color: #fff;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
        }

        .promo-message {
            min-height: 17px;
            margin: -4px 0 10px;
            color: #a855f7;
            font-size: 11px;
        }

        .total-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 13px;
        }

        .total-label {
            color: #8d8d96;
            font-size: 13px;
        }

        .total-price {
            font-size: 21px;
            font-weight: 900;
        }

        .checkout-button {
            width: 100%;
            height: 49px;
            border: none;
            border-radius: 13px;
            background: #7c3aed;
            color: #fff;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
        }

        .checkout-button:active {
            transform: scale(0.985);
        }

        /* =========================
           TOAST
        ========================= */

        .toast {
            position: fixed;
            left: 50%;
            bottom: 20px;
            z-index: 300;
            max-width: calc(100% - 30px);
            padding: 12px 16px;
            border: 1px solid #34343d;
            border-radius: 12px;
            background: #17171c;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 12px 40px rgba(0,0,0,0.4);
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, 15px);
            transition: 0.25s;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-7px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes modalUp {
            from {
                opacity: 0;
                transform: translateY(35px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           DESKTOP
        ========================= */

        @media (min-width: 700px) {
            body {
                max-width: 1300px;
                margin: 0 auto;
                padding: 28px;
            }

            .products {
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 16px;
            }

            .modal-backdrop {
                align-items: center;
            }

            .modal {
                max-height: 90vh;
            }
        }

        /* =========================
           REDUCED MOTION
        ========================= */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="brand">
            <h1 class="brand-title">MY STORE</h1>
            <div class="brand-subtitle">CLOTHING & ACCESSORIES</div>
        </div>

        <div class="header-actions">

            <button
                class="icon-button"
                id="searchButton"
                aria-label="Поиск"
            >
                🔎
            </button>

            <button
                class="icon-button"
                id="cartButton"
                aria-label="Корзина"
            >
                🛒
                <span
                    class="cart-count"
                    id="cartCount"
                >
                    0
                </span>
            </button>

        </div>

    </header>


    <!-- SEARCH -->

    <div
        class="search-wrapper"
        id="searchWrapper"
    >
        <input
            class="search-input"
            id="searchInput"
            type="text"
            placeholder="Поиск товара..."
            autocomplete="off"
        >
    </div>


    <!-- CATEGORIES -->

    <div class="categories">

        <button
            class="category active"
            data-category="all"
        >
            ВСЕ
        </button>

        <button
            class="category"
            data-category="cat1"
        >
            1
        </button>

        <button
            class="category"
            data-category="cat2"
        >
            2
        </button>

        <button
            class="category"
            data-category="cat3"
        >
            3
        </button>

        <button
            class="category"
            data-category="cat4"
        >
            4
        </button>

        <button
            class="category"
            data-category="cat5"
        >
            5
        </button>

        <button
            class="category"
            data-category="cat6"
        >
            6
        </button>

    </div>


    <!-- TOOLBAR -->

    <div class="toolbar">

        <div
            class="products-count"
            id="productsCount"
        >
            Товаров: 0
        </div>

        <select
            class="sort-select"
            id="sortSelect"
        >
            <option value="popular">Популярные</option>
            <option value="cheap">Сначала дешевле</option>
            <option value="expensive">Сначала дороже</option>
        </select>

    </div>


    <!-- PRODUCTS -->

    <main>

        <div
            class="products"
            id="products"
        >

            <div class="skeleton">
                <div class="skeleton-image"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line short"></div>
            </div>

            <div class="skeleton">
                <div class="skeleton-image"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line short"></div>
            </div>

            <div class="skeleton">
                <div class="skeleton-image"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line short"></div>
            </div>

            <div class="skeleton">
                <div class="skeleton-image"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line short"></div>
            </div>

        </div>


        <div
            class="empty-search"
            id="emptySearch"
        >
            <div class="empty-search-icon">
                👀
            </div>

            <div class="empty-search-title">
                Товар сбежал
            </div>

            <div class="empty-search-text">
                Похоже, этот товар решил спрятаться.<br>
                Попробуй другой запрос.
            </div>
        </div>

    </main>


    <!-- PRODUCT MODAL -->

    <div
        class="modal-backdrop"
        id="productModal"
    >

        <div class="modal">

            <div class="modal-header">

                <h2
                    class="modal-title"
                    id="productModalTitle"
                >
                    Товар
                </h2>

                <button
                    class="close-button"
                    id="closeProductModal"
                >
                    ×
                </button>

            </div>


            <div class="gallery">

                <div
                    class="gallery-track"
                    id="galleryTrack"
                >
                </div>

                <button
                    class="gallery-arrow prev"
                    id="galleryPrev"
                >
                    ‹
                </button>

                <button
                    class="gallery-arrow next"
                    id="galleryNext"
                >
                    ›
                </button>

                <div
                    class="gallery-dots"
                    id="galleryDots"
                >
                </div>

            </div>


            <div class="product-detail-content">

                <h2
                    class="detail-name"
                    id="detailName"
                >
                </h2>

                <div
                    class="detail-price"
                    id="detailPrice"
                >
                </div>

                <div
                    class="detail-description"
                    id="detailDescription"
                >
                </div>

                <div
                    class="detail-stock"
                    id="detailStock"
                >
                </div>

                <div class="quantity-row">

                    <div class="quantity-control">

                        <button
                            id="detailMinus"
                        >
                            −
                        </button>

                        <span
                            id="detailQuantity"
                        >
                            1
                        </span>

                        <button
                            id="detailPlus"
                        >
                            +
                        </button>

                    </div>

                    <button
                        class="add-button"
                        id="addToCartButton"
                    >
                        Добавить в корзину
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- CART MODAL -->

    <div
        class="modal-backdrop"
        id="cartModal"
    >

        <div class="modal">

            <div class="modal-header">

                <h2 class="modal-title">
                    Корзина
                </h2>

                <button
                    class="close-button"
                    id="closeCartModal"
                >
                    ×
                </button>

            </div>


            <div
                class="cart-items"
                id="cartItems"
            >
            </div>


            <div
                class="cart-footer"
                id="cartFooter"
            >

                <div class="promo-row">

                    <input
                        class="promo-input"
                        id="promoInput"
                        type="text"
                        placeholder="ПРОМОКОД"
                    >

                    <button
                        class="promo-button"
                        id="promoButton"
                    >
                        Применить
                    </button>

                </div>

                <div
                    class="promo-message"
                    id="promoMessage"
                >
                </div>

                <div class="total-row">

                    <span class="total-label">
                        Итого
                    </span>

                    <span
                        class="total-price"
                        id="totalPrice"
                    >
                        0 ₽
                    </span>

                </div>

                <button
                    class="checkout-button"
                    id="checkoutButton"
                >
                    Оформить заказ
                </button>

            </div>

        </div>

    </div>


    <!-- TOAST -->

    <div
        class="toast"
        id="toast"
    >
    </div>


    <!-- PRODUCTS -->

    <script src="products.js"></script>


    <!-- APP -->

    <script>

        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();


        /* =========================
           ELEMENTS
        ========================= */

        const productsContainer =
            document.getElementById("products");

        const productsCount =
            document.getElementById("productsCount");

        const emptySearch =
            document.getElementById("emptySearch");

        const searchButton =
            document.getElementById("searchButton");

        const searchWrapper =
            document.getElementById("searchWrapper");

        const searchInput =
            document.getElementById("searchInput");

        const sortSelect =
            document.getElementById("sortSelect");

        const cartButton =
            document.getElementById("cartButton");

        const cartCount =
            document.getElementById("cartCount");

        const productModal =
            document.getElementById("productModal");

        const cartModal =
            document.getElementById("cartModal");

        const closeProductModal =
            document.getElementById("closeProductModal");

        const closeCartModal =
            document.getElementById("closeCartModal");

        const productModalTitle =
            document.getElementById("productModalTitle");

        const detailName =
            document.getElementById("detailName");

        const detailPrice =
            document.getElementById("detailPrice");

        const detailDescription =
            document.getElementById("detailDescription");

        const detailStock =
            document.getElementById("detailStock");

        const detailQuantity =
            document.getElementById("detailQuantity");

        const detailMinus =
            document.getElementById("detailMinus");

        const detailPlus =
            document.getElementById("detailPlus");

        const addToCartButton =
            document.getElementById("addToCartButton");

        const galleryTrack =
            document.getElementById("galleryTrack");

        const galleryDots =
            document.getElementById("galleryDots");

        const galleryPrev =
            document.getElementById("galleryPrev");

        const galleryNext =
            document.getElementById("galleryNext");

        const cartItems =
            document.getElementById("cartItems");

        const cartFooter =
            document.getElementById("cartFooter");

        const promoInput =
            document.getElementById("promoInput");

        const promoButton =
            document.getElementById("promoButton");

        const promoMessage =
            document.getElementById("promoMessage");

        const totalPrice =
            document.getElementById("totalPrice");

        const checkoutButton =
            document.getElementById("checkoutButton");

        const toast =
            document.getElementById("toast");


        /* =========================
           STATE
        ========================= */

        let currentCategory = "all";

        let currentProduct = null;

        let currentGalleryIndex = 0;

        let detailQty = 1;

        let promoApplied = false;

        let cart = [];


        /* =========================
           LOAD CART
        ========================= */

        try {

            const savedCart =
                localStorage.getItem("myStoreCart");

            if (savedCart) {

                const parsed =
                    JSON.parse(savedCart);

                if (Array.isArray(parsed)) {
                    cart = parsed;
                }

            }

        } catch (error) {

            cart = [];

        }


        /* =========================
           HELPERS
        ========================= */

        function formatPrice(price) {

            return price
                .toLocaleString("ru-RU")
                .replace(/\u00A0/g, " ") + " ₽";

        }


        function getProductById(id) {

            return products.find(
                product => product.id === id
            );

        }


        function saveCart() {

            localStorage.setItem(
                "myStoreCart",
                JSON.stringify(cart)
            );

        }


        function showToast(message) {

            toast.textContent = message;

            toast.classList.add("show");

            clearTimeout(
                showToast.timeout
            );

            showToast.timeout =
                setTimeout(() => {

                    toast.classList.remove("show");

                }, 2200);

        }


        function getStockText(product) {

            if (product.stock <= 0) {

                return "Нет в наличии";

            }

            if (product.stock <= 3) {

                return "Осталось " +
                    product.stock;

            }

            return "В наличии";

        }


        /* =========================
           RENDER PRODUCTS
        ========================= */

        function renderProducts() {

            let filtered =
                [...products];


            /* CATEGORY */

            if (currentCategory !== "all") {

                filtered =
                    filtered.filter(
                        product =>
                            product.category ===
                            currentCategory
                    );

            }


            /* SEARCH */

            const query =
                searchInput.value
                    .trim()
                    .toLowerCase();


            if (query) {

                filtered =
                    filtered.filter(product => {

                        return (
                            product.name
                                .toLowerCase()
                                .includes(query)

                            ||

                            product.description
                                .toLowerCase()
                                .includes(query)

                            ||

                            product.category
                                .toLowerCase()
                                .includes(query)
                        );

                    });

            }


            /* SORT */

            if (sortSelect.value === "cheap") {

                filtered.sort(
                    (a, b) =>
                        a.price - b.price
                );

            }

            if (sortSelect.value === "expensive") {

                filtered.sort(
                    (a, b) =>
                        b.price - a.price
                );

            }

            if (sortSelect.value === "popular") {

                filtered.sort(
                    (a, b) =>
                        b.popularity -
                        a.popularity
                );

            }


            /* COUNT */

            productsCount.textContent =
                "Товаров: " +
                filtered.length;


            /* EMPTY */

            if (filtered.length === 0) {

                productsContainer.innerHTML = "";

                emptySearch.classList.add("show");

                return;

            }

            emptySearch.classList.remove("show");


            /* CARDS */

            productsContainer.innerHTML =
                filtered.map(
                    (product, index) =>
                        createProductCard(
                            product,
                            index
                        )
                ).join("");


            /* EVENTS */

            document
                .querySelectorAll(".product")
                .forEach(card => {

                    card.addEventListener(
                        "click",
                        () => {

                            const id =
                                Number(
                                    card.dataset.id
                                );

                            openProduct(
                                getProductById(id)
                            );

                        }
                    );

                });

        }


        /* =========================
           PRODUCT CARD
        ========================= */

        function createProductCard(
            product,
            index
        ) {

            const soldOut =
                product.stock <= 0;

            const lowStock =
                product.stock > 0 &&
                product.stock <= 3;


            let stockClass = "";

            if (soldOut) {
                stockClass = "out";
            }

            if (lowStock) {
                stockClass = "low";
            }


            const stockBadge =
                soldOut
                    ? "НЕТ В НАЛИЧИИ"
                    : lowStock
                        ? "ОСТАЛОСЬ " +
                          product.stock
                        : "В НАЛИЧИИ";


            return `

                <article
                    class="product ${soldOut ? "sold-out" : ""}"
                    data-id="${product.id}"
                    style="animation-delay:${index * 45}ms"
                >

                    <div class="product-image-wrapper">

                        <img
                            src="${product.image}"
                            alt="${product.name}"
                            loading="lazy"
                        >

                        <div
                            class="stock-badge ${stockClass}"
                        >
                            ${stockBadge}
                        </div>

                        ${
                            product.sale
                                ? `
                                    <div class="sale-badge">
                                        SALE
                                    </div>
                                `
                                : ""
                        }

                        ${
                            soldOut
                                ? `
                                    <div class="sold-out-overlay">
                                        <span>
                                            НЕТ В НАЛИЧИИ
                                        </span>
                                    </div>
                                `
                                : ""
                        }

                    </div>


                    <div class="product-info">

                        <h2 class="product-name">
                            ${product.name}
                        </h2>

                        <div class="product-price-row">

                            <span class="product-price">
                                ${formatPrice(product.price)}
                            </span>

                            ${
                                product.oldPrice
                                    ? `
                                        <span class="old-price">
                                            ${formatPrice(product.oldPrice)}
                                        </span>
                                    `
                                    : ""
                            }

                        </div>

                    </div>

                </article>

            `;

        }


        /* =========================
           OPEN PRODUCT
        ========================= */

        function openProduct(product) {

            if (!product) {
                return;
            }

            currentProduct = product;

            currentGalleryIndex = 0;

            detailQty = 1;

            productModalTitle.textContent =
                product.name;

            detailName.textContent =
                product.name;

            detailPrice.innerHTML =
                formatPrice(product.price) +
                (
                    product.oldPrice
                        ? `
                            <span class="detail-old-price">
                                ${formatPrice(product.oldPrice)}
                            </span>
                        `
                        : ""
                );

            detailDescription.textContent =
                product.description;


            /* STOCK */

            if (product.stock <= 0) {

                detailStock.textContent =
                    "Нет в наличии";

            } else if (product.stock <= 3) {

                detailStock.textContent =
                    "Осталось: " +
                    product.stock;

            } else {

                detailStock.textContent =
                    "В наличии: " +
                    product.stock;

            }


            updateDetailQuantity();

            renderGallery();

            productModal.classList.add("active");

            document.body.style.overflow =
                "hidden";

        }


        /* =========================
           CLOSE PRODUCT
        ========================= */

        function closeProduct() {

            productModal.classList.remove(
                "active"
            );

            document.body.style.overflow =
                "";

            currentProduct = null;

        }


        /* =========================
           GALLERY
        ========================= */

        function renderGallery() {

            if (!currentProduct) {
                return;
            }

            const gallery =
                currentProduct.gallery &&
                currentProduct.gallery.length
                    ? currentProduct.gallery
                    : [currentProduct.image];


            galleryTrack.innerHTML =
                gallery.map(
                    image => `
                        <div class="gallery-slide">
                            <img
                                src="${image}"
                                alt="${currentProduct.name}"
                            >
                        </div>
                    `
                ).join("");


            galleryDots.innerHTML =
                gallery.map(
                    (_, index) => `
                        <span
                            class="gallery-dot ${
                                index === 0
                                    ? "active"
                                    : ""
                            }"
                        ></span>
                    `
                ).join("");


            updateGallery();

        }


        function updateGallery() {

            galleryTrack.style.transform =
                `translateX(-${
                    currentGalleryIndex * 100
                }%)`;


            document
                .querySelectorAll(".gallery-dot")
                .forEach(
                    (dot, index) => {

                        dot.classList.toggle(
                            "active",
                            index ===
                                currentGalleryIndex
                        );

                    }
                );

        }


        function nextGallery() {

            if (!currentProduct) {
                return;
            }

            const length =
                currentProduct.gallery.length;

            currentGalleryIndex =
                (
                    currentGalleryIndex + 1
                ) % length;

            updateGallery();

        }


        function prevGallery() {

            if (!currentProduct) {
                return;
            }

            const length =
                currentProduct.gallery.length;

            currentGalleryIndex =
                (
                    currentGalleryIndex - 1 + length
                ) % length;

            updateGallery();

        }


        /* =========================
           DETAIL QUANTITY
        ========================= */

        function updateDetailQuantity() {

            detailQuantity.textContent =
                detailQty;


            if (
                !currentProduct ||
                currentProduct.stock <= 0
            ) {

                addToCartButton.disabled =
                    true;

                addToCartButton.textContent =
                    "Нет в наличии";

                detailMinus.disabled = true;

                detailPlus.disabled = true;

                return;

            }


            addToCartButton.disabled =
                false;

            addToCartButton.textContent =
                "Добавить в корзину";


            detailMinus.disabled =
                detailQty <= 1;

            detailPlus.disabled =
                detailQty >=
                currentProduct.stock;

        }


        detailMinus.addEventListener(
            "click",
            () => {

                if (detailQty > 1) {

                    detailQty--;

                    updateDetailQuantity();

                }

            }
        );


        detailPlus.addEventListener(
            "click",
            () => {

                if (
                    currentProduct &&
                    detailQty <
                        currentProduct.stock
                ) {

                    detailQty++;

                    updateDetailQuantity();

                }

            }
        );


        /* =========================
           ADD TO CART
        ========================= */

        addToCartButton.addEventListener(
            "click",
            () => {

                if (
                    !currentProduct ||
                    currentProduct.stock <= 0
                ) {
                    return;
                }


                const existing =
                    cart.find(
                        item =>
                            item.productId ===
                            currentProduct.id
                    );


                if (existing) {

                    existing.quantity =
                        Math.min(
                            existing.quantity +
                                detailQty,
                            currentProduct.stock
                        );

                } else {

                    cart.push({

                        productId:
                            currentProduct.id,

                        quantity:
                            detailQty

                    });

                }


                saveCart();

                updateCartCount();

                cartCount.classList.remove(
                    "bump"
                );

                void cartCount.offsetWidth;

                cartCount.classList.add(
                    "bump"
                );

                showToast(
                    "Товар добавлен в корзину 🛒"
                );


                setTimeout(
                    closeProduct,
                    300
                );

            }
        );


        /* =========================
           CART COUNT
        ========================= */

        function updateCartCount() {

            const total =
                cart.reduce(
                    (sum, item) =>
                        sum + item.quantity,
                    0
                );

            cartCount.textContent =
                total;

            cartCount.style.display =
                total > 0
                    ? "flex"
                    : "none";

        }


        /* =========================
           RENDER CART
        ========================= */

        function renderCart() {

            if (cart.length === 0) {

                cartItems.innerHTML = `

                    <div class="cart-empty">

                        <div class="cart-empty-icon">
                            🛒
                        </div>

                        <div class="cart-empty-title">
                            Корзина пуста
                        </div>

                        <div class="cart-empty-text">
                            Добавь что-нибудь,
                            что тебе понравится.
                        </div>

                    </div>

                `;

                cartFooter.style.display =
                    "none";

                return;

            }


            cartFooter.style.display =
                "block";


            cartItems.innerHTML =
                cart.map(item => {

                    const product =
                        getProductById(
                            item.productId
                        );


                    if (!product) {
                        return "";
                    }


                    return `

                        <div
                            class="cart-item"
                            data-id="${product.id}"
                        >

                            <div class="cart-item-image">

                                <img
                                    src="${product.image}"
                                    alt="${product.name}"
                                >

                            </div>


                            <div class="cart-item-info">

                                <div class="cart-item-name">
                                    ${product.name}
                                </div>

                                <div class="cart-item-price">
                                    ${formatPrice(product.price)}
                                </div>

                            </div>


                            <div class="cart-item-actions">

                                <div class="cart-quantity">

                                    <button
                                        onclick="changeCartQuantity(
                                            ${product.id},
                                            -1
                                        )"
                                    >
                                        −
                                    </button>

                                    <span>
                                        ${item.quantity}
                                    </span>

                                    <button
                                        onclick="changeCartQuantity(
                                            ${product.id},
                                            1
                                        )"
                                    >
                                        +
                                    </button>

                                </div>


                                <button
                                    class="remove-item"
                                    onclick="removeFromCart(
                                        ${product.id}
                                    )"
                                >
                                    ×
                                </button>

                            </div>

                        </div>

                    `;

                }).join("");


            updateCartTotal();

        }


        /* =========================
           CHANGE CART QUANTITY
        ========================= */

        function changeCartQuantity(
            productId,
            change
        ) {

            const index =
                cart.findIndex(
                    item =>
                        item.productId ===
                        productId
                );


            if (index === -1) {
                return;
            }


            const product =
                getProductById(productId);


            if (!product) {
                return;
            }


            cart[index].quantity += change;


            if (cart[index].quantity <= 0) {

                cart.splice(index, 1);

            } else {

                cart[index].quantity =
                    Math.min(
                        cart[index].quantity,
                        product.stock
                    );

            }


            saveCart();

            updateCartCount();

            renderCart();

        }


        /* =========================
           REMOVE
        ========================= */

        function removeFromCart(productId) {

            cart =
                cart.filter(
                    item =>
                        item.productId !==
                        productId
                );


            saveCart();

            updateCartCount();

            renderCart();

        }


        /* =========================
           TOTAL
        ========================= */

        function updateCartTotal() {

            let total =
                cart.reduce(
                    (sum, item) => {

                        const product =
                            getProductById(
                                item.productId
                            );

                        if (!product) {
                            return sum;
                        }

                        return sum +
                            product.price *
                            item.quantity;

                    },
                    0
                );


            if (promoApplied) {

                total *= 0.9;

            }


            totalPrice.textContent =
                formatPrice(
                    Math.round(total)
                );

        }


        /* =========================
           PROMO
        ========================= */

        promoButton.addEventListener(
            "click",
            () => {

                const code =
                    promoInput.value
                        .trim()
                        .toUpperCase();


                if (code === "FIRST") {

                    promoApplied = true;

                    promoMessage.textContent =
                        "Промокод применён — скидка 10%";

                    updateCartTotal();

                    return;

                }


                promoApplied = false;

                promoMessage.textContent =
                    "Такого промокода нет.";

                updateCartTotal();

            }
        );


        /* =========================
           OPEN CART
        ========================= */

        function openCart() {

            renderCart();

            cartModal.classList.add(
                "active"
            );

            document.body.style.overflow =
                "hidden";

        }


        function closeCart() {

            cartModal.classList.remove(
                "active"
            );

            document.body.style.overflow =
                "";

        }


        /* =========================
           SEARCH
        ========================= */

        searchButton.addEventListener(
            "click",
            () => {

                searchWrapper.classList.toggle(
                    "active"
                );


                if (
                    searchWrapper.classList.contains(
                        "active"
                    )
                ) {

                    setTimeout(
                        () =>
                            searchInput.focus(),
                        100
                    );

                } else {

                    searchInput.value = "";

                    renderProducts();

                }

            }
        );


        searchInput.addEventListener(
            "input",
            renderProducts
        );


        /* =========================
           SORT
        ========================= */

        sortSelect.addEventListener(
            "change",
            renderProducts
        );


        /* =========================
           CATEGORIES
        ========================= */

        document
            .querySelectorAll(".category")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        document
                            .querySelectorAll(
                                ".category"
                            )
                            .forEach(
                                item =>
                                    item.classList.remove(
                                        "active"
                                    )
                            );


                        button.classList.add(
                            "active"
                        );


                        currentCategory =
                            button.dataset.category;


                        renderProducts();

                    }
                );

            });


        /* =========================
           BUTTON EVENTS
        ========================= */

        cartButton.addEventListener(
            "click",
            openCart
        );


        closeProductModal.addEventListener(
            "click",
            closeProduct
        );


        closeCartModal.addEventListener(
            "click",
            closeCart
        );


        galleryNext.addEventListener(
            "click",
            nextGallery
        );


        galleryPrev.addEventListener(
            "click",
            prevGallery
        );


        productModal.addEventListener(
            "click",
            event => {

                if (
                    event.target ===
                    productModal
                ) {

                    closeProduct();

                }

            }
        );


        cartModal.addEventListener(
            "click",
            event => {

                if (
                    event.target ===
                    cartModal
                ) {

                    closeCart();

                }

            }
        );


        document.addEventListener(
            "keydown",
            event => {

                if (event.key === "Escape") {

                    closeProduct();

                    closeCart();

                }

            }
        );


        /* =========================
           SWIPE GALLERY
        ========================= */

        let touchStartX = 0;

        let touchEndX = 0;


        galleryTrack.addEventListener(
            "touchstart",
            event => {

                touchStartX =
                    event.changedTouches[0].screenX;

            },
            {
                passive: true
            }
        );


        galleryTrack.addEventListener(
            "touchend",
            event => {

                touchEndX =
                    event.changedTouches[0].screenX;


                const difference =
                    touchStartX -
                    touchEndX;


                if (Math.abs(difference) < 40) {
                    return;
                }


                if (difference > 0) {

                    nextGallery();

                } else {

                    prevGallery();

                }

            },
            {
                passive: true
            }
        );


        /* =========================
           CHECK CART AGAINST STOCK
        ========================= */

        function validateCartStock() {

            cart =
                cart.filter(item => {

                    const product =
                        getProductById(
                            item.productId
                        );

                    if (!product) {
                        return false;
                    }


                    if (product.stock <= 0) {
                        return false;
                    }


                    item.quantity =
                        Math.min(
                            item.quantity,
                            product.stock
                        );


                    return item.quantity > 0;

                });


            saveCart();

        }


        /* =========================
           INITIAL LOAD
        ========================= */

        validateCartStock();

        updateCartCount();


        setTimeout(
            () => {

                renderProducts();

            },
            450
        );

    </script>

</body>
</html>
