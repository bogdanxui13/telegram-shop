<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MY STORE</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 18px;
            font-family: Arial, sans-serif;
            background: #0b0b0f;
            color: #fff;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 25px;
        }

        .logo-block h1 {
            margin: 0;
            font-size: 25px;
            letter-spacing: 2px;
        }

        .logo-block p {
            margin: 4px 0 0;
            color: #777;
            font-size: 11px;
            letter-spacing: 2px;
        }

        .cart-button {
            position: relative;
            width: 48px;
            height: 48px;
            border: 1px solid #292933;
            border-radius: 14px;
            background: #15151c;
            color: #fff;
            font-size: 21px;
            transition: .2s;
        }

        .cart-button:hover {
            border-color: #a855f7;
            transform: translateY(-2px);
        }

        .cart-count {
            position: absolute;
            top: -6px;
            right: -6px;

            min-width: 20px;
            height: 20px;

            padding: 0 5px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;
            background: #a855f7;
            color: white;

            font-size: 11px;
            font-weight: bold;
        }

        .cart-count.hidden {
            display: none;
        }

        /* =========================
           SEARCH
        ========================= */

        .search {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
        }

        .search input {
            width: 100%;
            padding: 14px 16px;

            border: 1px solid #292933;
            border-radius: 13px;

            background: #15151c;
            color: #fff;

            outline: none;
            font-size: 15px;
        }

        .search input:focus {
            border-color: #a855f7;
        }

        /* =========================
           CATEGORIES
        ========================= */

        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
            margin-bottom: 15px;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .category {
            flex: 0 0 auto;

            padding: 9px 15px;

            border: 1px solid #292933;
            border-radius: 20px;

            background: #15151c;
            color: #aaa;

            font-size: 13px;

            transition: .2s;
        }

        .category.active {
            background: #a855f7;
            border-color: #a855f7;
            color: #fff;
        }

        /* =========================
           SORT
        ========================= */

        .sort-row {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 18px;
        }

        .sort-select {
            padding: 9px 12px;

            border: 1px solid #292933;
            border-radius: 10px;

            background: #15151c;
            color: #aaa;

            outline: none;
        }

        /* =========================
           PRODUCTS
        ========================= */

        .products {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .product {
            position: relative;

            background: #121218;
            border: 1px solid #20202a;
            border-radius: 16px;

            padding: 8px;

            overflow: hidden;

            animation: productAppear .35s ease;
            transition: .2s;
        }

        .product:hover {
            transform: translateY(-3px);
            border-color: #363642;
        }

        @keyframes productAppear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .product-image {
            position: relative;
        }

        .product img {
            width: 100%;
            height: 230px;

            display: block;

            object-fit: cover;
            border-radius: 12px;

            transition: .3s;
        }

        .product:hover img {
            transform: scale(1.02);
        }

        .sale-badge {
            position: absolute;
            top: 8px;
            left: 8px;

            padding: 5px 8px;

            border-radius: 8px;

            background: #a855f7;
            color: white;

            font-size: 10px;
            font-weight: bold;
        }

        .stock-badge {
            position: absolute;
            bottom: 8px;
            left: 8px;

            padding: 5px 8px;

            border-radius: 8px;

            background: rgba(0,0,0,.75);
            color: #ddd;

            font-size: 10px;
        }

        .sold-out {
            opacity: .65;
        }

        .sold-out img {
            filter: grayscale(1);
            opacity: .55;
        }

        .sold-overlay {
            position: absolute;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background: rgba(0,0,0,.35);

            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .product h2 {
            margin: 10px 3px 4px;

            font-size: 15px;
            line-height: 1.2;
        }

        .price {
            margin: 0 3px 2px;

            font-size: 16px;
            font-weight: bold;
        }

        .old-price {
            margin-left: 5px;

            color: #666;
            text-decoration: line-through;
            font-size: 12px;
            font-weight: normal;
        }

        .product-stock {
            margin: 0 3px 9px;

            color: #777;
            font-size: 11px;
        }

        .product button {
            width: 100%;

            padding: 10px;

            border: 0;
            border-radius: 10px;

            background: #a855f7;
            color: white;

            font-size: 13px;
            font-weight: bold;

            transition: .2s;
        }

        .product button:hover {
            background: #9333ea;
        }

        .product button:disabled {
            background: #292933;
            color: #666;
            cursor: not-allowed;
        }

        /* =========================
           NO RESULTS
        ========================= */

        .no-results {
            display: none;

            padding: 50px 20px;

            text-align: center;
            color: #666;
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            position: fixed;
            inset: 0;

            z-index: 100;

            display: none;
            align-items: flex-end;
            justify-content: center;

            background: rgba(0,0,0,.72);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            width: 100%;
            max-width: 600px;
            max-height: 92vh;

            overflow-y: auto;

            padding: 20px;

            border-radius: 22px 22px 0 0;

            background: #111117;

            animation: modalUp .25s ease;
        }

        @keyframes modalUp {
            from {
                transform: translateY(100%);
            }

            to {
                transform: translateY(0);
            }
        }

        .modal-top {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 15px;
        }

        .modal-top h2 {
            margin: 0;
            font-size: 20px;
        }

        .close {
            width: 36px;
            height: 36px;

            border: 0;
            border-radius: 10px;

            background: #20202a;
            color: #fff;

            font-size: 20px;
        }

        /* =========================
           CART
        ========================= */

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 18px;
        }

        .cart-header h2 {
            margin: 0;
        }

        .clear-cart {
            border: 0;
            background: none;
            color: #777;
            font-size: 12px;
        }

        .clear-cart:hover {
            color: #ff5c5c;
        }

        .cart-empty {
            padding: 45px 15px;

            text-align: center;
            color: #666;
        }

        .cart-empty-icon {
            margin-bottom: 10px;
            font-size: 42px;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 70px 1fr auto;

            gap: 12px;

            padding: 12px 0;

            border-bottom: 1px solid #24242d;
        }

        .cart-item img {
            width: 70px;
            height: 85px;

            object-fit: cover;

            border-radius: 10px;
        }

        .cart-item-info {
            min-width: 0;
        }

        .cart-item-name {
            margin-bottom: 5px;

            font-size: 14px;
            font-weight: bold;
        }

        .cart-item-price {
            margin-bottom: 8px;

            color: #aaa;
            font-size: 13px;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quantity button {
            width: 28px;
            height: 28px;

            border: 1px solid #30303a;
            border-radius: 8px;

            background: #191921;
            color: white;

            font-size: 16px;
        }

        .quantity button:disabled {
            opacity: .35;
            cursor: not-allowed;
        }

        .quantity span {
            min-width: 20px;
            text-align: center;
            font-size: 13px;
        }

        .cart-item-right {
            text-align: right;
        }

        .cart-item-total {
            margin-bottom: 8px;

            font-size: 14px;
            font-weight: bold;
        }

        .remove-item {
            border: 0;
            background: none;
            color: #777;
            font-size: 11px;
        }

        .remove-item:hover {
            color: #ff5c5c;
        }

        /* =========================
           PROMO
        ========================= */

        .promo {
            display: flex;
            gap: 8px;

            margin-top: 18px;
        }

        .promo input {
            flex: 1;

            min-width: 0;

            padding: 12px;

            border: 1px solid #292933;
            border-radius: 10px;

            background: #15151c;
            color: white;

            outline: none;
        }

        .promo button {
            padding: 0 15px;

            border: 0;
            border-radius: 10px;

            background: #292933;
            color: white;
        }

        .promo-message {
            min-height: 17px;

            margin-top: 7px;

            font-size: 11px;
        }

        .promo-success {
            color: #6ee7b7;
        }

        .promo-error {
            color: #ff6b6b;
        }

        /* =========================
           TOTAL
        ========================= */

        .cart-summary {
            margin-top: 20px;
            padding-top: 16px;

            border-top: 1px solid #292933;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;

            margin-bottom: 9px;

            color: #999;
            font-size: 13px;
        }

        .summary-row.discount {
            color: #6ee7b7;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;

            margin-top: 15px;

            font-size: 20px;
            font-weight: bold;
        }

        .checkout-button {
            width: 100%;

            margin-top: 18px;
            padding: 14px;

            border: 0;
            border-radius: 12px;

            background: #a855f7;
            color: white;

            font-size: 15px;
            font-weight: bold;

            transition: .2s;
        }

        .checkout-button:hover {
            background: #9333ea;
        }

        /* =========================
           TOAST
        ========================= */

        .toast {
            position: fixed;

            left: 50%;
            bottom: 25px;

            z-index: 300;

            transform: translate(-50%, 100px);

            padding: 12px 17px;

            border-radius: 12px;

            background: #22222b;
            color: white;

            font-size: 13px;

            opacity: 0;

            transition: .3s;
        }

        .toast.show {
            transform: translate(-50%, 0);
            opacity: 1;
        }

        /* =========================
           DESKTOP
        ========================= */

        @media (min-width: 900px) {

            body {
                max-width: 1400px;
                margin: auto;
                padding: 30px;
            }

            .products {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }

            .product img {
                height: 300px;
            }

            .modal {
                align-items: center;
            }

            .modal-content {
                border-radius: 22px;
                max-height: 90vh;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo-block">
        <h1>MY STORE</h1>
        <p>CLOTHING & ACCESSORIES</p>
    </div>

    <button class="cart-button" onclick="openCart()">
        🛒
        <span id="cartCount" class="cart-count hidden">0</span>
    </button>

</header>


<div class="search">

    <input
        id="searchInput"
        type="text"
        placeholder="Поиск товара..."
        oninput="renderProducts()"
    >

</div>


<div class="categories">

    <div class="categories">

    <button class="category active" onclick="setCategory('all', this)">
        ВСЕ
    </button>

    <button class="category" onclick="setCategory('cat1', this)">
        1
    </button>

    <button class="category" onclick="setCategory('cat2', this)">
        2
    </button>

    <button class="category" onclick="setCategory('cat3', this)">
        3
    </button>

    <button class="category" onclick="setCategory('cat4', this)">
        4
    </button>

</div>

<div class="sort-row">

    <select
        id="sortSelect"
        class="sort-select"
        onchange="renderProducts()"
    >
        <option value="popular">Популярные</option>
        <option value="cheap">Сначала дешевле</option>
        <option value="expensive">Сначала дороже</option>
    </select>

</div>


<div id="products" class="products"></div>

<div id="noResults" class="no-results">
    <div style="font-size:35px;">🔎</div>
    <p>Ничего не найдено</p>
</div>


<!-- =========================
     PRODUCT MODAL
========================= -->

<div
    id="productModal"
    class="modal"
    onclick="closeModalOutside(event)"
>

    <div class="modal-content">

        <div class="modal-top">

            <h2 id="modalName"></h2>

            <button
                class="close"
                onclick="closeProductModal()"
            >
                ×
            </button>

        </div>

        <img
            id="modalImage"
            style="
                width:100%;
                height:350px;
                object-fit:cover;
                border-radius:14px;
            "
        >

        <div
            id="modalDescription"
            style="
                margin-top:15px;
                color:#aaa;
                line-height:1.5;
                font-size:14px;
            "
        ></div>

        <div
            id="modalPrice"
            style="
                margin-top:15px;
                font-size:21px;
                font-weight:bold;
            "
        ></div>

        <div
            id="modalStock"
            style="
                margin-top:7px;
                color:#777;
                font-size:12px;
            "
        ></div>

        <div
            style="
                display:flex;
                align-items:center;
                justify-content:space-between;
                gap:15px;
                margin-top:18px;
            "
        >

            <div class="quantity">

                <button onclick="changeModalQuantity(-1)">
                    −
                </button>

                <span id="modalQuantity">
                    1
                </span>

                <button onclick="changeModalQuantity(1)">
                    +
                </button>

            </div>

            <button
                id="modalAddButton"
                onclick="addCurrentProductToCart()"
                style="
                    flex:1;
                    padding:13px;
                    border:0;
                    border-radius:11px;
                    background:#a855f7;
                    color:white;
                    font-weight:bold;
                "
            >
                В корзину
            </button>

        </div>

    </div>

</div>


<!-- =========================
     CART MODAL
========================= -->

<div
    id="cartModal"
    class="modal"
    onclick="closeCartOutside(event)"
>

    <div class="modal-content">

        <div class="cart-header">

            <h2>Корзина</h2>

            <button
                class="close"
                onclick="closeCart()"
            >
                ×
            </button>

        </div>


        <div id="cartContent"></div>

    </div>

</div>


<div id="toast" class="toast">
    Товар добавлен в корзину
</div>


<script src="products.js"></script>

<script>

    /* =========================
       TELEGRAM
    ========================= */

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    /* =========================
       STATE
    ========================= */

    let currentCategory = "all";

    let currentProduct = null;

    let modalQuantity = 1;

    let cart = [];

    let promoCode = "";

    let promoDiscount = 0;


    /* =========================
       LOAD CART
    ========================= */

    function loadCart() {

        try {

            const savedCart = localStorage.getItem("myStoreCart");

            if (savedCart) {
                cart = JSON.parse(savedCart);
            }

        } catch (error) {

            cart = [];

        }

        validateCartStock();

        saveCart();

        updateCartCount();
    }


    /* =========================
       SAVE CART
    ========================= */

    function saveCart() {

        localStorage.setItem(
            "myStoreCart",
            JSON.stringify(cart)
        );

    }


    /* =========================
       STOCK VALIDATION
    ========================= */

    function validateCartStock() {

        cart = cart.filter(item => {

            const product = products.find(
                p => p.id === item.id
            );

            if (!product) {
                return false;
            }

            if (product.stock <= 0) {
                return false;
            }

            if (item.quantity > product.stock) {
                item.quantity = product.stock;
            }

            return true;

        });

    }


    /* =========================
       CART COUNT
    ========================= */

    function updateCartCount() {

        const count = cart.reduce(
            (sum, item) => sum + item.quantity,
            0
        );

        const badge = document.getElementById("cartCount");

        badge.textContent = count;

        if (count > 0) {
            badge.classList.remove("hidden");
        } else {
            badge.classList.add("hidden");
        }

    }


    /* =========================
       CATEGORY
    ========================= */

    function setCategory(category, button) {

        currentCategory = category;

        document
            .querySelectorAll(".category")
            .forEach(btn => btn.classList.remove("active"));

        button.classList.add("active");

        renderProducts();

    }


    /* =========================
       RENDER PRODUCTS
    ========================= */

    function renderProducts() {

        const container =
            document.getElementById("products");

        const noResults =
            document.getElementById("noResults");

        const search =
            document
                .getElementById("searchInput")
                .value
                .toLowerCase()
                .trim();

        const sort =
            document.getElementById("sortSelect").value;


        let filtered = products.filter(product => {

            const categoryMatch =
                currentCategory === "all" ||
                product.category === currentCategory;

            const searchMatch =
                !search ||
                product.name.toLowerCase().includes(search) ||
                product.description.toLowerCase().includes(search);

            return categoryMatch && searchMatch;

        });


        if (sort === "popular") {

            filtered.sort(
                (a, b) => b.popularity - a.popularity
            );

        }

        if (sort === "cheap") {

            filtered.sort(
                (a, b) => a.price - b.price
            );

        }

        if (sort === "expensive") {

            filtered.sort(
                (a, b) => b.price - a.price
            );

        }


        container.innerHTML = "";


        if (filtered.length === 0) {

            noResults.style.display = "block";

            return;

        }


        noResults.style.display = "none";


        filtered.forEach(product => {

            const soldOut =
                product.stock <= 0;

            const lowStock =
                product.stock > 0 &&
                product.stock <= 3;


            let stockText = "В НАЛИЧИИ";

            if (soldOut) {
                stockText = "НЕТ В НАЛИЧИИ";
            }

            if (lowStock) {
                stockText = `ОСТАЛОСЬ ${product.stock}`;
            }


            const card =
                document.createElement("div");

            card.className =
                "product" +
                (soldOut ? " sold-out" : "");


            card.innerHTML = `

                <div
                    class="product-image"
                    onclick="openProduct(${product.id})"
                >

                    <img
                        src="${product.image}"
                        alt="${product.name}"
                    >

                    ${
                        product.sale
                        ? `<div class="sale-badge">SALE</div>`
                        : ""
                    }

                    <div class="stock-badge">
                        ${stockText}
                    </div>

                    ${
                        soldOut
                        ? `<div class="sold-overlay">
                                НЕТ В НАЛИЧИИ
                           </div>`
                        : ""
                    }

                </div>


                <h2>
                    ${product.name}
                </h2>


                <div class="price">

                    ${formatPrice(product.price)}

                    ${
                        product.oldPrice
                        ? `
                            <span class="old-price">
                                ${formatPrice(product.oldPrice)}
                            </span>
                        `
                        : ""
                    }

                </div>


                <div class="product-stock">
                    ${
                        soldOut
                        ? "Товар закончился"
                        : lowStock
                            ? `Осталось ${product.stock} шт.`
                            : `В наличии: ${product.stock} шт.`
                    }
                </div>


                <button
                    onclick="openProduct(${product.id})"
                    ${soldOut ? "disabled" : ""}
                >
                    ${
                        soldOut
                        ? "Нет в наличии"
                        : "Подробнее"
                    }
                </button>

            `;


            container.appendChild(card);

        });

    }


    /* =========================
       PRODUCT MODAL
    ========================= */

    function openProduct(id) {

        const product =
            products.find(p => p.id === id);

        if (!product) return;


        currentProduct = product;

        modalQuantity = 1;


        document.getElementById("modalName")
            .textContent = product.name;

        document.getElementById("modalImage")
            .src = product.gallery
                ? product.gallery[0]
                : product.image;

        document.getElementById("modalDescription")
            .textContent = product.description;

        document.getElementById("modalPrice")
            .textContent = formatPrice(product.price);

        document.getElementById("modalQuantity")
            .textContent = modalQuantity;


        const stockElement =
            document.getElementById("modalStock");

        const addButton =
            document.getElementById("modalAddButton");


        if (product.stock <= 0) {

            stockElement.textContent =
                "Нет в наличии";

            addButton.disabled = true;
            addButton.textContent =
                "Нет в наличии";

            addButton.style.background =
                "#292933";

        } else {

            stockElement.textContent =
                `В наличии: ${product.stock} шт.`;

            addButton.disabled = false;
            addButton.textContent =
                "В корзину";

            addButton.style.background =
                "#a855f7";

        }


        document
            .getElementById("productModal")
            .classList.add("active");

    }


    function closeProductModal() {

        document
            .getElementById("productModal")
            .classList.remove("active");

        currentProduct = null;

    }


    function changeModalQuantity(change) {

        if (!currentProduct) return;


        modalQuantity += change;


        if (modalQuantity < 1) {
            modalQuantity = 1;
        }


        if (
            modalQuantity >
            currentProduct.stock
        ) {
            modalQuantity =
                currentProduct.stock;
        }


        document.getElementById("modalQuantity")
            .textContent = modalQuantity;

    }


    /* =========================
       ADD TO CART
    ========================= */

    function addCurrentProductToCart() {

        if (!currentProduct) return;

        if (currentProduct.stock <= 0) return;


        const existing =
            cart.find(
                item => item.id === currentProduct.id
            );


        if (existing) {

            existing.quantity += modalQuantity;


            if (
                existing.quantity >
                currentProduct.stock
            ) {

                existing.quantity =
                    currentProduct.stock;

            }

        } else {

            cart.push({
                id: currentProduct.id,
                quantity: modalQuantity
            });

        }


        saveCart();

        updateCartCount();

        showToast(
            `${currentProduct.name} добавлен в корзину`
        );

        closeProductModal();

    }


    /* =========================
       OPEN CART
    ========================= */

    function openCart() {

        validateCartStock();

        saveCart();

        renderCart();

        document
            .getElementById("cartModal")
            .classList.add("active");

    }


    function closeCart() {

        document
            .getElementById("cartModal")
            .classList.remove("active");

    }


    /* =========================
       RENDER CART
    ========================= */

    function renderCart() {

        const container =
            document.getElementById("cartContent");


        if (cart.length === 0) {

            container.innerHTML = `

                <div class="cart-empty">

                    <div class="cart-empty-icon">
                        🛒
                    </div>

                    <div>
                        Корзина пуста
                    </div>

                    <div
                        style="
                            margin-top:7px;
                            font-size:12px;
                        "
                    >
                        Добавь что-нибудь из магазина
                    </div>

                </div>

            `;

            return;

        }


        let html = `

            <button
                class="clear-cart"
                onclick="clearCart()"
                style="
                    display:block;
                    margin-left:auto;
                    margin-bottom:10px;
                "
            >
                Очистить корзину
            </button>

        `;


        cart.forEach(item => {

            const product =
                products.find(
                    p => p.id === item.id
                );

            if (!product) return;


            const itemTotal =
                product.price *
                item.quantity;


            html += `

                <div class="cart-item">

                    <img
                        src="${product.image}"
                        alt="${product.name}"
                    >


                    <div class="cart-item-info">

                        <div class="cart-item-name">
                            ${product.name}
                        </div>

                        <div class="cart-item-price">
                            ${formatPrice(product.price)} / шт.
                        </div>


                        <div class="quantity">

                            <button
                                onclick="changeCartQuantity(${product.id}, -1)"
                                ${item.quantity <= 1 ? "disabled" : ""}
                            >
                                −
                            </button>

                            <span>
                                ${item.quantity}
                            </span>

                            <button
                                onclick="changeCartQuantity(${product.id}, 1)"
                                ${
                                    item.quantity >= product.stock
                                    ? "disabled"
                                    : ""
                                }
                            >
                                +
                            </button>

                        </div>

                    </div>


                    <div class="cart-item-right">

                        <div class="cart-item-total">
                            ${formatPrice(itemTotal)}
                        </div>

                        <button
                            class="remove-item"
                            onclick="removeFromCart(${product.id})"
                        >
                            Удалить
                        </button>

                    </div>

                </div>

            `;

        });


        const subtotal =
            calculateSubtotal();

        const discount =
            calculateDiscount(subtotal);

        const total =
            subtotal - discount;


        html += `

            <div class="promo">

                <input
                    id="promoInput"
                    type="text"
                    placeholder="Промокод"
                    value="${promoCode}"
                >

                <button onclick="applyPromo()">
                    Применить
                </button>

            </div>


            <div
                id="promoMessage"
                class="promo-message"
            ></div>


            <div class="cart-summary">

                <div class="summary-row">

                    <span>
                        Товары
                    </span>

                    <span>
                        ${formatPrice(subtotal)}
                    </span>

                </div>


                ${
                    discount > 0
                    ? `
                        <div class="summary-row discount">

                            <span>
                                Скидка
                            </span>

                            <span>
                                −${formatPrice(discount)}
                            </span>

                        </div>
                    `
                    : ""
                }


                <div class="summary-total">

                    <span>
                        Итого
                    </span>

                    <span>
                        ${formatPrice(total)}
                    </span>

                </div>


                <button
                    class="checkout-button"
                    onclick="checkout()"
                >
                    Оформить заказ
                </button>

            </div>

        `;


        container.innerHTML = html;


        if (promoCode) {

            const message =
                document.getElementById(
                    "promoMessage"
                );

            if (promoDiscount > 0) {

                message.textContent =
                    `Промокод применён: −${promoDiscount}%`;

                message.className =
                    "promo-message promo-success";

            }

        }

    }


    /* =========================
       CHANGE CART QUANTITY
    ========================= */

    function changeCartQuantity(
        productId,
        change
    ) {

        const item =
            cart.find(
                item => item.id === productId
            );

        const product =
            products.find(
                p => p.id === productId
            );


        if (!item || !product) return;


        item.quantity += change;


        if (item.quantity <= 0) {

            cart =
                cart.filter(
                    item => item.id !== productId
                );

        }


        if (
            item &&
            item.quantity > product.stock
        ) {

            item.quantity =
                product.stock;

        }


        saveCart();

        updateCartCount();

        renderCart();

    }


    /* =========================
       REMOVE ITEM
    ========================= */

    function removeFromCart(productId) {

        cart =
            cart.filter(
                item => item.id !== productId
            );


        saveCart();

        updateCartCount();

        renderCart();

        showToast("Товар удалён");

    }


    /* =========================
       CLEAR CART
    ========================= */

    function clearCart() {

        if (cart.length === 0) return;


        cart = [];

        promoCode = "";
        promoDiscount = 0;


        saveCart();

        updateCartCount();

        renderCart();

        showToast("Корзина очищена");

    }


    /* =========================
       TOTAL
    ========================= */

    function calculateSubtotal() {

        return cart.reduce(
            (sum, item) => {

                const product =
                    products.find(
                        p => p.id === item.id
                    );

                if (!product) {
                    return sum;
                }

                return sum +
                    product.price *
                    item.quantity;

            },
            0
        );

    }


    /* =========================
       PROMO
    ========================= */

    function applyPromo() {

        const input =
            document.getElementById(
                "promoInput"
            );

        if (!input) return;


        const code =
            input.value
                .trim()
                .toUpperCase();


        const message =
            document.getElementById(
                "promoMessage"
            );


        /*
            ТЕСТОВЫЙ ПРОМОКОД

            FIRST = скидка 10%

            Позже подключим настоящую
            систему промокодов через backend.
        */

        if (code === "FIRST") {

            promoCode = code;
            promoDiscount = 10;


            message.textContent =
                "Промокод применён: −10%";

            message.className =
                "promo-message promo-success";


            renderCart();


        } else {

            promoCode = "";
            promoDiscount = 0;


            message.textContent =
                "Такого промокода нет";

            message.className =
                "promo-message promo-error";

        }

    }


    function calculateDiscount(subtotal) {

        if (!promoDiscount) {
            return 0;
        }

        return Math.round(
            subtotal *
            promoDiscount /
            100
        );

    }


    /* =========================
       CHECKOUT
    ========================= */

    function checkout() {

        if (cart.length === 0) {

            showToast(
                "Корзина пуста"
            );

            return;

        }


        validateCartStock();

        saveCart();


        if (cart.length === 0) {

            renderCart();

            showToast(
                "Товары закончились"
            );

            return;

        }


        const subtotal =
            calculateSubtotal();

        const discount =
            calculateDiscount(subtotal);

        const total =
            subtotal - discount;


        let orderText =
            "Новый заказ\n\n";


        cart.forEach(item => {

            const product =
                products.find(
                    p => p.id === item.id
                );

            if (!product) return;


            orderText +=
                `${product.name} × ${item.quantity} — ` +
                `${formatPrice(
                    product.price *
                    item.quantity
                )}\n`;

        });


        orderText +=
            `\nТовары: ${formatPrice(subtotal)}`;


        if (discount > 0) {

            orderText +=
                `\nСкидка: −${formatPrice(discount)}`;

        }


        orderText +=
            `\nИтого: ${formatPrice(total)}`;


        /*
            Пока реального оформления нет.

            Здесь позже подключим:
            - данные покупателя
            - адрес/доставку
            - отправку заказа боту
            - MySklad
            - оплату
        */


        alert(
            "Оформление заказа\n\n" +
            orderText +
            "\n\nСистема оформления пока находится в разработке."
        );

    }


    /* =========================
       FORMAT PRICE
    ========================= */

    function formatPrice(price) {

        return new Intl.NumberFormat(
            "ru-RU"
        ).format(price) + " ₽";

    }


    /* =========================
       TOAST
    ========================= */

    let toastTimer;


    function showToast(text) {

        const toast =
            document.getElementById("toast");


        toast.textContent = text;

        toast.classList.add("show");


        clearTimeout(toastTimer);


        toastTimer =
            setTimeout(() => {

                toast.classList.remove("show");

            }, 1800);

    }


    /* =========================
       CLOSE OUTSIDE
    ========================= */

    function closeModalOutside(event) {

        if (
            event.target.id ===
            "productModal"
        ) {

            closeProductModal();

        }

    }


    function closeCartOutside(event) {

        if (
            event.target.id ===
            "cartModal"
        ) {

            closeCart();

        }

    }


    /* =========================
       ESC
    ========================= */

    document.addEventListener(
        "keydown",
        event => {

            if (event.key === "Escape") {

                closeProductModal();

                closeCart();

            }

        }
    );


    /* =========================
       INIT
    ========================= */

    loadCart();

    renderProducts();

</script>

</body>
