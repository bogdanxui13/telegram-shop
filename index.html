<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MY STORE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
    --bg:#08070b;
    --surface:#111016;
    --card:#15131b;
    --card2:#1b1822;
    --text:#f7f4fa;
    --muted:#8e8998;
    --border:#27232f;
    --accent:#a855f7;
    --accent2:#ec4899;
    --danger:#ff5270;
    --green:#54d38a;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
    margin:0;
    padding:0 12px 32px;
    background:
        radial-gradient(circle at 90% 0%,rgba(168,85,247,.12),transparent 28%),
        radial-gradient(circle at 0% 35%,rgba(236,72,153,.06),transparent 25%),
        var(--bg);
    color:var(--text);
    font-family:Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

button,input,select{font:inherit}
button{cursor:pointer}

header{
    padding:18px 2px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:10;
    background:rgba(8,7,11,.88);
    backdrop-filter:blur(14px);
}

.brand{display:flex;flex-direction:column}

.logo{
    font-family:Impact,"Arial Black",sans-serif;
    font-size:25px;
    letter-spacing:1.4px;
    line-height:1;
    background:linear-gradient(90deg,#fff,#d8b4ff 55%,#ff8bc5);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.subtitle{
    color:var(--muted);
    font-size:10px;
    margin-top:5px;
    letter-spacing:1.5px;
    text-transform:uppercase;
}

.header-actions{display:flex;gap:8px}

.header-button{
    width:42px;height:42px;
    border:1px solid var(--border);
    border-radius:13px;
    background:rgba(21,19,27,.92);
    color:white;
    font-size:19px;
    display:grid;
    place-items:center;
    transition:.2s ease;
}

.header-button:active{transform:scale(.92)}

.cart-button{position:relative}

.cart-count{
    position:absolute;
    top:-5px;right:-5px;
    min-width:18px;height:18px;
    padding:0 4px;
    border-radius:99px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:white;
    font-size:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
}

.search{
    max-height:0;
    opacity:0;
    overflow:hidden;
    transform:translateY(-5px);
    transition:.25s ease;
}

.search.active{
    max-height:70px;
    opacity:1;
    transform:translateY(0);
    margin:3px 0 10px;
}

.search input{
    width:100%;
    padding:13px 15px;
    border:1px solid var(--border);
    border-radius:13px;
    background:var(--surface);
    color:white;
    outline:none;
}

.search input:focus{border-color:rgba(168,85,247,.7)}

.categories{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding:4px 0 13px;
    scrollbar-width:none;
}

.categories::-webkit-scrollbar{display:none}

.category{
    flex-shrink:0;
    border:1px solid var(--border);
    background:var(--surface);
    color:#aaa4b2;
    padding:9px 15px;
    border-radius:99px;
    font-size:12px;
    transition:.22s ease;
}

.category.active{
    color:white;
    border-color:transparent;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 5px 20px rgba(168,85,247,.2);
}

.toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:1px 0 12px;
}

.products-count{font-size:12px;color:var(--muted)}

.sort{
    appearance:none;
    background:var(--surface);
    border:1px solid var(--border);
    color:#ddd8e2;
    padding:8px 28px 8px 10px;
    border-radius:10px;
    outline:none;
    font-size:11px;
}

.products{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
}

.product{
    position:relative;
    background:linear-gradient(180deg,var(--card),#121017);
    border:1px solid var(--border);
    border-radius:17px;
    overflow:hidden;
    min-width:0;
    cursor:pointer;
    opacity:0;
    transform:translateY(10px);
    animation:cardIn .45s ease forwards;
    transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
}

.product:active{transform:scale(.975)}

@keyframes cardIn{
    to{opacity:1;transform:translateY(0)}
}

.product-image-wrapper{
    position:relative;
    aspect-ratio:1/1;
    overflow:hidden;
    background:#0d0b11;
}

.product-image{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
    transition:transform .45s ease;
}

.product:active .product-image{transform:scale(1.025)}

.badge{
    position:absolute;
    left:8px;top:8px;
    z-index:2;
    padding:5px 7px;
    border-radius:7px;
    background:rgba(0,0,0,.72);
    font-size:8px;
    font-weight:800;
    letter-spacing:.4px;
}

.badge.new{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
}

.badge.last{background:#b93655}

.favorite{
    display:none;
}

.product-info{padding:10px}

.product-name{
    font-size:13px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.product-price{
    margin-top:6px;
    font-size:15px;
    font-weight:900;
}

.product-stock{
    margin-top:5px;
    color:var(--muted);
    font-size:10px;
}

.product-stock.low{color:#ffad55}
.product-stock.none{color:var(--danger)}

.no-results{
    grid-column:1/-1;
    text-align:center;
    padding:60px 15px;
    color:var(--muted);
}

.no-results .big{font-size:34px;margin-bottom:10px}

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:50;
    background:rgba(0,0,0,.72);
    align-items:flex-end;
    backdrop-filter:blur(7px);
}

.modal.active{display:flex;animation:fadeIn .22s ease}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.modal-content{
    width:100%;
    max-height:94vh;
    overflow-y:auto;
    background:#0f0e13;
    border:1px solid var(--border);
    border-bottom:none;
    border-radius:24px 24px 0 0;
    padding:12px 14px 24px;
    animation:sheetIn .3s ease;
}

@keyframes sheetIn{
    from{transform:translateY(40px);opacity:.5}
    to{transform:translateY(0);opacity:1}
}

.modal-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    min-height:38px;
}

.modal-label{
    color:var(--muted);
    font-size:10px;
    letter-spacing:1.2px;
    text-transform:uppercase;
}

.close-button{
    width:34px;height:34px;
    border:none;border-radius:50%;
    background:#24212b;
    color:white;font-size:20px;
}

.gallery{
    position:relative;
    margin-top:5px;
    border-radius:17px;
    overflow:hidden;
    background:#0b0a0f;
}

.gallery img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
    transition:opacity .18s ease,transform .35s ease;
}

.gallery-nav{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    pointer-events:none;
}

.gallery-arrow{
    pointer-events:auto;
    width:38px;height:38px;
    margin:0 9px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:50%;
    background:rgba(0,0,0,.5);
    color:white;
    font-size:20px;
    backdrop-filter:blur(6px);
}

.gallery-dots{
    position:absolute;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:5px;
}

.gallery-dot{
    width:5px;height:5px;
    border-radius:50%;
    background:rgba(255,255,255,.45);
    transition:.2s;
}

.gallery-dot.active{
    width:15px;
    border-radius:99px;
    background:white;
}

.modal-title{
    font-family:"Arial Black",Arial,sans-serif;
    font-size:24px;
    margin:15px 0 5px;
    letter-spacing:-.5px;
}

.modal-price{font-size:21px;font-weight:900}

.modal-stock{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

.description-title{
    margin-top:20px;
    font-size:12px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1px;
}

.description{
    color:#aaa4b2;
    font-size:14px;
    line-height:1.6;
    margin-top:7px;
}

.quantity{
    display:flex;
    align-items:center;
    gap:12px;
    margin:18px 0;
}

.quantity button,.cart-controls button{
    width:36px;height:36px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--surface);
    color:white;
    font-size:18px;
}

.quantity span{min-width:25px;text-align:center;font-weight:800}

.add-button,.checkout-button{
    width:100%;
    border:none;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:white;
    padding:15px;
    border-radius:13px;
    font-size:15px;
    font-weight:900;
    box-shadow:0 8px 28px rgba(168,85,247,.18);
    transition:.2s ease;
}

.add-button:active,.checkout-button:active{transform:scale(.985)}
.add-button:disabled{opacity:.4;box-shadow:none}

.cart-item{
    display:flex;
    gap:10px;
    padding:13px 0;
    border-bottom:1px solid var(--border);
}

.cart-item img{
    width:70px;height:70px;
    object-fit:cover;
    border-radius:11px;
}

.cart-item-info{flex:1;min-width:0}

.cart-item-name{font-size:13px;font-weight:800}

.cart-item-price{margin-top:4px;color:#aaa4b2;font-size:12px}

.cart-controls{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:8px;
}

.cart-controls button{
    width:28px;height:28px;
    border-radius:8px;
    font-size:15px;
}

.remove{color:#ff6680!important}

.empty-cart{
    text-align:center;
    padding:55px 20px;
    color:var(--muted);
}

.total{
    display:flex;
    justify-content:space-between;
    margin:19px 0;
    font-size:18px;
    font-weight:900;
}

.promo{
    display:flex;
    gap:7px;
    margin-top:17px;
}

.promo input{
    flex:1;
    min-width:0;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--surface);
    color:white;
    padding:12px;
    outline:none;
}

.promo button{
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--surface);
    color:white;
    padding:0 13px;
}

.promo-message{
    color:#aaa4b2;
    font-size:11px;
    margin-top:7px;
}

.cart-title{
    font-family:"Arial Black",Arial,sans-serif;
    font-size:24px;
    margin:5px 0 0;
}

@media(min-width:700px){
    body{max-width:900px;margin:auto}
    .products{grid-template-columns:repeat(4,1fr)}
    .product:hover{
        transform:translateY(-4px);
        border-color:rgba(168,85,247,.55);
        box-shadow:0 10px 30px rgba(0,0,0,.35);
    }
}
</style>
</head>

<body>

<header>
    <div class="brand">
        <div class="logo">MY STORE</div>
        <div class="subtitle">CLOTHING & ACCESSORIES</div>
    </div>

    <div class="header-actions">
        <button class="header-button" onclick="toggleSearch()" aria-label="Поиск">⌕</button>
        <button class="header-button cart-button" onclick="openCart()" aria-label="Корзина">
            🛒
            <span class="cart-count" id="cartCount">0</span>
        </button>
    </div>
</header>

<div class="search" id="searchBox">
    <input id="searchInput" type="text" placeholder="Найти товар..." oninput="searchProducts()">
</div>

<div class="categories" id="categories">
    <button class="category active" onclick="setCategory('all',this)">1</button>
    <button class="category" onclick="setCategory('cat2',this)">2</button>
    <button class="category" onclick="setCategory('cat3',this)">3</button>
    <button class="category" onclick="setCategory('cat4',this)">4</button>
    <button class="category" onclick="setCategory('cat5',this)">5</button>
    <button class="category" onclick="setCategory('cat6',this)">6</button>
</div>

<div class="toolbar">
    <div class="products-count" id="productsCount"></div>
    <select class="sort" id="sortSelect" onchange="sortProducts()">
        <option value="popular">По популярности</option>
        <option value="cheap">Сначала дешевле</option>
        <option value="expensive">Сначала дороже</option>
    </select>
</div>

<div class="products" id="products"></div>

<!-- PRODUCT MODAL -->
<div class="modal" id="productModal">
    <div class="modal-content">
        <div class="modal-top">
            <div class="modal-label">Товар</div>
            <button class="close-button" onclick="closeProduct()">×</button>
        </div>

        <div class="gallery">
            <img id="galleryImage" alt="">
            <div class="gallery-nav">
                <button class="gallery-arrow" onclick="previousImage()">‹</button>
                <button class="gallery-arrow" onclick="nextImage()">›</button>
            </div>
            <div class="gallery-dots" id="galleryDots"></div>
        </div>

        <h2 class="modal-title" id="modalTitle"></h2>
        <div class="modal-price" id="modalPrice"></div>
        <div class="modal-stock" id="modalStock"></div>

        <div class="description-title">Описание</div>
        <div class="description" id="modalDescription"></div>

        <div class="description-title">Количество</div>
        <div class="quantity">
            <button onclick="changeQuantity(-1)">−</button>
            <span id="quantity">1</span>
            <button onclick="changeQuantity(1)">+</button>
        </div>

        <button class="add-button" id="addButton" onclick="addToCart()">Добавить в корзину</button>
    </div>
</div>

<!-- CART MODAL -->
<div class="modal" id="cartModal">
    <div class="modal-content">
        <div class="modal-top">
            <div class="modal-label">Ваш заказ</div>
            <button class="close-button" onclick="closeCart()">×</button>
        </div>

        <h2 class="cart-title">Корзина 🛒</h2>
        <div id="cartItems"></div>

        <div class="promo">
            <input id="promoInput" placeholder="Промокод">
            <button onclick="applyPromo()">Применить</button>
        </div>
        <div class="promo-message" id="promoMessage"></div>

        <div class="total">
            <span>Итого</span>
            <span id="totalPrice">0 ₽</span>
        </div>

        <button class="checkout-button" onclick="checkout()">Оформить заказ</button>
    </div>
</div>

<script src="products.js"></script>
<script>
const tg = window.Telegram?.WebApp;

if(tg){
    tg.ready();
    tg.expand();
}

let currentCategory = "all";
let currentProduct = null;
let quantity = 1;
let galleryIndex = 0;
let cart = [];
let promoDiscount = 0;

function formatPrice(price){
    return price.toLocaleString("ru-RU") + " ₽";
}

function renderProducts(){
    let list = [...products];

    const search = document.getElementById("searchInput").value.toLowerCase().trim();

    if(currentCategory !== "all"){
        list = list.filter(product => product.category === currentCategory);
    }

    if(search){
        list = list.filter(product =>
            product.name.toLowerCase().includes(search) ||
            product.description.toLowerCase().includes(search)
        );
    }

    const sort = document.getElementById("sortSelect").value;

    if(sort === "cheap") list.sort((a,b)=>a.price-b.price);
    if(sort === "expensive") list.sort((a,b)=>b.price-a.price);
    if(sort === "popular") list.sort((a,b)=>(b.popular?1:0)-(a.popular?1:0));

    const container = document.getElementById("products");
    container.innerHTML = "";

    document.getElementById("productsCount").textContent =
        `${list.length} ${list.length === 1 ? "товар" : "товаров"}`;

    if(list.length === 0){
        container.innerHTML = `
            <div class="no-results">
                <div class="big">⌕</div>
                <div>Похоже, этот товар решил спрятаться.</div>
                <div>Попробуй другой запрос.</div>
            </div>`;
        return;
    }

    list.forEach((product,index)=>{
        let badge = "";
        if(product.sale) badge = `<div class="badge">СКИДКА</div>`;
        else if(product.stock <= 2) badge = `<div class="badge last">ПОСЛЕДНИЕ</div>`;
        else if(product.category === "cat2") badge = `<div class="badge new">НОВИНКА</div>`;

        const stockClass =
            product.stock === 0 ? "none" :
            product.stock <= 3 ? "low" : "";

        const stockText =
            product.stock === 0 ? "Нет в наличии" :
            `В наличии: ${product.stock}`;

        container.innerHTML += `
            <div class="product" style="animation-delay:${Math.min(index*45,300)}ms" onclick="openProduct(${product.id})">
                <div class="product-image-wrapper">
                    ${badge}
                    <img class="product-image" src="${product.image}" alt="${product.name}">
                </div>
                <div class="product-info">
                    <div class="product-name">${product.name}</div>
                    <div class="product-price">${formatPrice(product.price)}</div>
                    <div class="product-stock ${stockClass}">${stockText}</div>
                </div>
            </div>`;
    });
}

function setCategory(category,button){
    currentCategory = category;
    document.querySelectorAll(".category").forEach(item=>item.classList.remove("active"));
    button.classList.add("active");
    renderProducts();
}

function toggleSearch(){
    const box = document.getElementById("searchBox");
    box.classList.toggle("active");
    if(box.classList.contains("active")){
        setTimeout(()=>document.getElementById("searchInput").focus(),100);
    }
}

function searchProducts(){renderProducts()}
function sortProducts(){renderProducts()}

function openProduct(id){
    currentProduct = products.find(product=>product.id===id);
    if(!currentProduct) return;

    quantity = 1;
    galleryIndex = 0;

    document.getElementById("quantity").textContent = quantity;
    document.getElementById("modalTitle").textContent = currentProduct.name;
    document.getElementById("modalPrice").textContent = formatPrice(currentProduct.price);
    document.getElementById("modalStock").textContent =
        currentProduct.stock > 0 ? `В наличии: ${currentProduct.stock} шт.` : "Нет в наличии";
    document.getElementById("modalDescription").textContent = currentProduct.description;
    document.getElementById("addButton").disabled = currentProduct.stock === 0;

    renderGallery();
    document.getElementById("productModal").classList.add("active");
    document.body.style.overflow = "hidden";
}

function renderGallery(){
    const images = currentProduct.gallery?.length ? currentProduct.gallery : [currentProduct.image];
    const image = document.getElementById("galleryImage");

    image.style.opacity = "0";
    setTimeout(()=>{
        image.src = images[galleryIndex];
        image.style.opacity = "1";
    },90);

    document.getElementById("galleryDots").innerHTML =
        images.map((_,i)=>`<span class="gallery-dot ${i===galleryIndex?"active":""}"></span>`).join("");
}

function nextImage(){
    if(!currentProduct) return;
    const images = currentProduct.gallery?.length ? currentProduct.gallery : [currentProduct.image];
    galleryIndex = (galleryIndex + 1) % images.length;
    renderGallery();
}

function previousImage(){
    if(!currentProduct) return;
    const images = currentProduct.gallery?.length ? currentProduct.gallery : [currentProduct.image];
    galleryIndex = (galleryIndex - 1 + images.length) % images.length;
    renderGallery();
}

function closeProduct(){
    document.getElementById("productModal").classList.remove("active");
    document.body.style.overflow = "";
}

function changeQuantity(change){
    if(!currentProduct || currentProduct.stock === 0) return;
    quantity += change;
    quantity = Math.max(1, Math.min(quantity,currentProduct.stock));
    document.getElementById("quantity").textContent = quantity;
}

function addToCart(){
    if(!currentProduct || currentProduct.stock === 0) return;

    const existing = cart.find(item=>item.product.id===currentProduct.id);

    if(existing){
        existing.quantity = Math.min(existing.quantity + quantity,currentProduct.stock);
    }else{
        cart.push({product:currentProduct,quantity});
    }

    updateCart();
    closeProduct();

    if(tg?.showAlert) tg.showAlert("Товар добавлен в корзину ✓");
    else alert("Товар добавлен в корзину ✓");
}

function updateCart(){
    const count = cart.reduce((sum,item)=>sum+item.quantity,0);
    document.getElementById("cartCount").textContent = count;
}

function openCart(){
    renderCart();
    document.getElementById("cartModal").classList.add("active");
    document.body.style.overflow = "hidden";
}

function closeCart(){
    document.getElementById("cartModal").classList.remove("active");
    document.body.style.overflow = "";
}

function renderCart(){
    const container = document.getElementById("cartItems");
    container.innerHTML = "";

    if(cart.length === 0){
        container.innerHTML = `<div class="empty-cart">Корзина пока пустая 🛒<br><br>Добавь сюда что-нибудь красивое.</div>`;
        document.getElementById("totalPrice").textContent = "0 ₽";
        return;
    }

    cart.forEach((item,index)=>{
        container.innerHTML += `
            <div class="cart-item">
                <img src="${item.product.image}" alt="${item.product.name}">
                <div class="cart-item-info">
                    <div class="cart-item-name">${item.product.name}</div>
                    <div class="cart-item-price">${formatPrice(item.product.price)}</div>
                    <div class="cart-controls">
                        <button onclick="changeCartQuantity(${index},-1)">−</button>
                        <span>${item.quantity}</span>
                        <button onclick="changeCartQuantity(${index},1)">+</button>
                        <button class="remove" onclick="removeFromCart(${index})">×</button>
                    </div>
                </div>
            </div>`;
    });

    updateTotal();
}

function changeCartQuantity(index,change){
    const item = cart[index];
    if(!item) return;

    item.quantity += change;

    if(item.quantity <= 0) cart.splice(index,1);
    else if(item.quantity > item.product.stock) item.quantity = item.product.stock;

    updateCart();
    renderCart();
}

function removeFromCart(index){
    cart.splice(index,1);
    updateCart();
    renderCart();
}

function updateTotal(){
    let total = cart.reduce((sum,item)=>sum+item.product.price*item.quantity,0);

    if(promoDiscount > 0){
        total -= Math.round(total * promoDiscount);
    }

    document.getElementById("totalPrice").textContent = formatPrice(total);
}

function applyPromo(){
    const input = document.getElementById("promoInput");
    const message = document.getElementById("promoMessage");
    const code = input.value.trim().toUpperCase();

    if(code === "FIRST"){
        promoDiscount = 0.10;
        message.textContent = "Промокод применён — скидка 10% ✓";
    }else if(code === ""){
        promoDiscount = 0;
        message.textContent = "Введи промокод.";
    }else{
        promoDiscount = 0;
        message.textContent = "Такого промокода пока нет.";
    }

    updateTotal();
}

function checkout(){
    if(cart.length === 0){
        if(tg?.showAlert) tg.showAlert("Корзина пустая");
        else alert("Корзина пустая");
        return;
    }

    if(tg?.showAlert) tg.showAlert("Систему оформления заказа подключим следующим этапом.");
    else alert("Систему оформления заказа подключим следующим этапом.");
}

document.getElementById("productModal").addEventListener("click",e=>{
    if(e.target.id==="productModal") closeProduct();
});

document.getElementById("cartModal").addEventListener("click",e=>{
    if(e.target.id==="cartModal") closeCart();
});

renderProducts();
updateCart();
</script>
</body>
</html>
