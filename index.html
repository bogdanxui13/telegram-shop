<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой магазин</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    * {
        box-sizing: border-box;
    }
    body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: #f2f2f2;
        color: #111;
    }
    h1 {
        margin-top: 0;
        text-align: center;
    }
    .products {
        display: grid;
        gap: 15px;
    }
    .product {
        background: white;
        border-radius: 15px;
        padding: 12px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    }
    .product img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        border-radius: 12px;
    }
    .product h2 {
        margin: 10px 0 5px;
        font-size: 20px;
    }
    .price {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 10px;
    }
    button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 10px;
        background: #2481cc;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }
    button:active {
        transform: scale(0.98);
    }
</style>
</head>
<body>
<h1>🛍 Мой магазин</h1>
<div class="products">
    <div class="product">
        <img src="https://picsum.photos/500/400?random=1" alt="Товар 1">
        <h2>Товар №1</h2>
        <div class="price">1 990 ₽</div>
        <button>Подробнее</button>
    </div>
    <div class="product">
        <img src="https://picsum.photos/500/400?random=2" alt="Товар 2">
        <h2>Товар №2</h2>
        <div class="price">2 990 ₽</div>
        <button>Подробнее</button>
    </div>
    <div class="product">
        <img src="https://picsum.photos/500/400?random=3" alt="Товар 3">
        <h2>Товар №3</h2>
        <div class="price">990 ₽</div>
        <button>Подробнее</button>
    </div>
</div>
<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
</script>
</body>
</html>
