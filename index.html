<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY STORE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    :root {
        --bg: #0b0a0f;
        --card: #14121a;
        --card-hover: #1a1722;
        --text: #ffffff;
        --muted: #96919f;
        --border: #25212e;
        --accent: #a855f7;
        --accent-2: #ec4899;
        --danger: #ff4d67;
    }
    * {
        box-sizing: border-box;
    }
    html {
        scroll-behavior: smooth;
    }
    body {
        margin: 0;
        padding: 0 14px 35px;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
    }
    button,
    input {
        font-family: inherit;
    }
    /* HEADER */
    header {
        padding: 18px 0 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .logo {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.8px;
    }
    .header-actions {
        display: flex;
        gap: 8px;
    }
    .header-button {
        width: 42px;
        height: 42px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--card);
        color: white;
        font-size: 18px;
        cursor: pointer;
    }
    .cart-button {
        position: relative;
    }
    .cart-count {
        position: absolute;
        top: -5px;
        right: -5px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--accent-2);
        color: white;
        font-size: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
    }
    /* SEARCH */
    .search {
        display: none;
        margin: 5px 0 13px;
    }
    .search.active {
        display: block;
    }
    .search input {
        width: 100%;
        padding: 13px 15px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--card);
        color: white;
        outline: none;
        font-size: 15px;
    }
    .search input::placeholder {
        color: var(--muted);
    }
    /* CATEGORIES */
    .categories {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 4px 0 13px;
        scrollbar-width: none;
    }
    .categories::-webkit-scrollbar {
        display: none;
    }
    .category {
        flex-shrink: 0;
        border: 1px solid var(--border);
        background: var(--card);
        color: #bcb6c5;
        padding: 9px 14px;
        border-radius: 20px;
        font-size: 13px;
        cursor: pointer;
    }
    .category.active {
        background: linear-gradient(
            135deg,
            var(--accent),
            var(--accent-2)
        );
        color: white;
        border-color: transparent;
    }
    /* SORT */
    .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
    }
    .products-count {
        color: var(--muted);
        font-size: 13px;
    }
    .sort {
        background: var(--card);
        border: 1px solid var(--border);
        color: #ddd;
        padding: 8px 10px;
        border-radius: 9px;
        outline: none;
        font-size: 12px;
    }
    /* PRODUCTS */
    .products {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
    }
    .product {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    min-width: 0;
    transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}

.product:hover {
    transform: translateY(-3px);
    border-color: rgba(168, 85, 247, 0.55);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
}

.product:active {
    transform: scale(0.98);
}

.product-image-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: #0f0d14;
}

.product-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease;
}

.product:hover .product-image {
    transform: scale(1.04);
}
    .favorite {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 31px;
        height: 31px;
        border: none;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.65);
        color: white;
        font-size: 16px;
        cursor: pointer;
    }
    .favorite.active {
        color: #ff4f9a;
    }
    .badge {
        position: absolute;
        left: 8px;
        top: 8px;
        padding: 5px 7px;
        border-radius: 7px;
        background: rgba(0, 0, 0, 0.7);
        font-size: 9px;
        font-weight: bold;
    }
    .badge.new {
        background: linear-gradient(
            135deg,
            var(--accent),
            var(--accent-2)
        );
    }
    .badge.last {
        background: #d9465f;
    }
    .product-info {
        padding: 10px;
    }
    .product-name {
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .product-price {
        margin-top: 5px;
        font-size: 15px;
        font-weight: 800;
    }
    .product-stock {
        margin-top: 5px;
        color: var(--muted);
        font-size: 11px;
    }
    .product-stock.low {
        color: #ff9f43;
    }
    .product-stock.none {
        color: var(--danger);
    }
    /* MODALS */
    .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        z-index: 20;
        align-items: flex-end;
    }
    .modal.active {
        display: flex;
    }
    .modal-content {
        width: 100%;
        max-height: 92vh;
        overflow-y: auto;
        background: #111015;
        border-top: 1px solid var(--border);
        border-radius: 22px 22px 0 0;
        padding: 16px;
    }
    .modal-top {
        display: flex;
        justify-content: flex-end;
    }
    .close-button {
        width: 34px;
        height: 34px;
        border: none;
        border-radius: 50%;
        background: #24212b;
        color: white;
        font-size: 19px;
        cursor: pointer;
    }
    .modal-image {
        width: 100%;
        max-height: 430px;
        object-fit: cover;
        border-radius: 15px;
        margin-top: 5px;
    }
    .modal-title {
        font-size: 23px;
        margin: 15px 0 5px;
    }
    .modal-price {
        font-size: 20px;
        font-weight: 800;
        margin-bottom: 7px;
    }
    .modal-stock {
        color: #8f8998;
        font-size: 13px;
        margin-bottom: 18px;
    }
    .description-title {
        font-size: 15px;
        margin-bottom: 7px;
    }
    .description {
        color: #aaa3b2;
        font-size: 14px;
        line-height: 1.55;
        margin-bottom: 18px;
    }
    .quantity {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 17px;
    }
    .quantity button {
        width: 36px;
        height: 36px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--card);
        color: white;
        font-size: 18px;
        cursor: pointer;
    }
    .quantity span {
        min-width: 20px;
        text-align: center;
        font-weight: bold;
    }
    .add-button,
    .checkout-button {
        width: 100%;
        border: none;
        background: linear-gradient(
            135deg,
            var(--accent),
            var(--accent-2)
        );
        color: white;
        padding: 14px;
        border-radius: 12px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
    }
    .add-button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
    }
    /* CART */
    .cart-item {
        display: flex;
        gap: 11px;
        padding: 12px 0;
        border-bottom: 1px solid var(--border);
    }
    .cart-item img {
        width: 72px;
        height: 72px;
        object-fit: cover;
        border-radius: 10px;
    }
.cart-item-info {
        flex: 1;
        min-width: 0;
    }
    .cart-item-name {
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 4px;
    }
    .cart-item-price {
        font-size: 13px;
        color: #aaa3b2;
    }
    .cart-controls {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 7px;
    }
    .cart-controls button {
        width: 27px;
        height: 27px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--card);
        color: white;
        cursor: pointer;
    }
    .remove {
        color: #ff6680 !important;
    }
    .empty-cart {
        text-align: center;
        padding: 50px 20px;
        color: var(--muted);
    }
    .total {
        display: flex;
        justify-content: space-between;
        margin: 20px 0;
        font-size: 19px;
        font-weight: bold;
    }
    /* PROMO */
    .promo {
        display: flex;
        gap: 7px;
        margin-bottom: 15px;
    }
    .promo input {
        flex: 1;
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--card);
        color: white;
        padding: 12px;
        outline: none;
    }
    .promo button {
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--card);
        color: white;
        padding: 0 13px;
        cursor: pointer;
    }
    .promo-message {
        font-size: 12px;
        color: #9c94a5;
        margin-top: -8px;
        margin-bottom: 15px;
    }
    /* NO RESULTS */
    .no-results {
        grid-column: 1 / -1;
        text-align: center;
        padding: 50px 10px;
        color: var(--muted);
    }
    @media (min-width: 700px) {
        body {
            max-width: 850px;
            margin: auto;
        }
        .products {
            grid-template-columns: repeat(4, 1fr);
        }
    }
</style>
</head>
<body>
<header>
    <div class="logo">MY STORE</div>
<div class="header-actions">
    <button class="header-button" onclick="toggleSearch()">⌕</button>
    <button class="header-button cart-button" onclick="openCart()">
        🛒
        <span class="cart-count" id="cartCount">0</span>
    </button>
</div>
</header>
<div class="search" id="searchBox">
    <input
        type="text"
        id="searchInput"
        placeholder="Поиск товара..."
        oninput="searchProducts()"
    >
</div>
<div class="categories">
    <button class="category active" onclick="setCategory('all', this)">
        Все
    </button>
<button class="category" onclick="setCategory('new', this)">
    Новинки
</button>
<button class="category" onclick="setCategory('popular', this)">
    Популярное
</button>
<button class="category" onclick="setCategory('sale', this)">
    Скидки
</button>
</div>
<div class="toolbar">
    <div class="products-count" id="productsCount"></div>
<select class="sort" id="sortSelect" onchange="sortProducts()">
    <option value="popular">Популярное</option>
    <option value="cheap">Сначала дешевле</option>
    <option value="expensive">Сначала дороже</option>
</select>
</div>
<div class="products" id="products"></div>
<!-- PRODUCT MODAL -->
<div class="modal" id="productModal">
<div class="modal-content">
    <div class="modal-top">
        <button class="close-button" onclick="closeProduct()">
            ×
        </button>
    </div>
    <img class="modal-image" id="modalImage">
    <h2 class="modal-title" id="modalTitle"></h2>
    <div class="modal-price" id="modalPrice"></div>
    <div class="modal-stock" id="modalStock"></div>
    <div class="description-title">
        Описание
    </div>
    <div class="description" id="modalDescription"></div>
    <div class="description-title">
        Количество
    </div>
    <div class="quantity">
        <button onclick="changeQuantity(-1)">−</button>
        <span id="quantity">1</span>
        <button onclick="changeQuantity(1)">+</button>
</div>
    <button
        class="add-button"
        id="addButton"
        onclick="addToCart()"
    >
        Добавить в корзину
    </button>
</div>
</div>
<!-- CART MODAL -->
<div class="modal" id="cartModal">
<div class="modal-content">
    <div class="modal-top">
        <button class="close-button" onclick="closeCart()">
            ×
        </button>
    </div>
    <h2>Корзина 🛒</h2>
    <div id="cartItems"></div>
    <div class="promo">
        <input
            id="promoInput"
            placeholder="Промокод"
        >
        <button onclick="applyPromo()">
            Применить
        </button>
    </div>
    <div class="promo-message" id="promoMessage"></div>
    <div class="total">
        <span>Итого</span>
        <span id="totalPrice">0 ₽</span>
    </div>
    <button class="checkout-button" onclick="checkout()">
        Оформить заказ
    </button>
</div>
</div>
<script src="products.js"></script>
<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    /* PRODUCTS */
   
    let currentCategory = "all";
    let currentProduct = null;
    let quantity = 1;
    let cart = [];
    let promoDiscount = 0;
    /* RENDER PRODUCTS */
    function renderProducts() {
        let list = [...products];
        const search =
            document.getElementById("searchInput").value
            .toLowerCase()
            .trim();
        if (currentCategory === "new") {
            list = list.filter(product => product.category === "new");
        }
        if (currentCategory === "popular") {
            list = list.filter(product => product.popular);
        }
        if (currentCategory === "sale") {
            list = list.filter(product => product.sale);
        }
        if (search) {
            list = list.filter(product =>
                product.name.toLowerCase().includes(search)
            );
        }
        const sort =
            document.getElementById("sortSelect").value;
        if (sort === "cheap") {
            list.sort((a, b) => a.price - b.price);
        }
        if (sort === "expensive") {
            list.sort((a, b) => b.price - a.price);
        }
        const container =
            document.getElementById("products");
        container.innerHTML = "";
        document.getElementById("productsCount").textContent =
            `${list.length} товаров`;
        if (list.length === 0) {
            container.innerHTML = `
                <div class="no-results">
                    Ничего не найдено 😔
                </div>
            `;
            return;
        }
        list.forEach(product => {
            let badge = "";
            if (product.sale) {
                badge =
                    `<div class="badge">СКИДКА</div>`;
            }
            else if (product.stock <= 2) {
                badge =
                    `<div class="badge last">ПОСЛЕДНИЕ</div>`;
            }
            else if (product.category === "new") {
                badge =
                    `<div class="badge new">НОВИНКА</div>`;
            }
            const favorite =
                localStorage.getItem(
                    `favorite_${product.id}`
                ) === "true";
            const stockClass =
                product.stock === 0
                    ? "none"
                    : product.stock <= 3
                    ? "low"
                    : "";
            const stockText =
                product.stock === 0
                    ? "Нет в наличии"
                    : `В наличии: ${product.stock}`;
            container.innerHTML += `
                <div
                    class="product"
                    onclick="openProduct(${product.id})"
                >
                    <div class="product-image-wrapper">
                        ${badge}
                        <button
                            class="favorite ${favorite ? "active" : ""}"
                            onclick="toggleFavorite(event, ${product.id})"
                        >
                            ${favorite ? "♥" : "♡"}
                        </button>
                        <img
                            class="product-image"
                            src="${product.image}"
                            alt="${product.name}"
                        >
                    </div>
                    <div class="product-info">
                        <div class="product-name">
                            ${product.name}
                        </div>
                        <div class="product-price">
                            ${product.price.toLocaleString("ru-RU")} ₽
                        </div>
                        <div class="product-stock ${stockClass}">
                            ${stockText}
                        </div>
                    </div>
                </div>
            `;
        });
    }
    /* CATEGORY */
    function setCategory(category, button) {
currentCategory = category;
        document
            .querySelectorAll(".category")
            .forEach(item =>
                item.classList.remove("active")
            );
        button.classList.add("active");
        renderProducts();
    }
    /* SEARCH */
    function toggleSearch() {
        const searchBox =
            document.getElementById("searchBox");
        searchBox.classList.toggle("active");
        if (searchBox.classList.contains("active")) {
            document.getElementById("searchInput").focus();
        }
    }
    function searchProducts() {
        renderProducts();
    }
    /* SORT */
    function sortProducts() {
        renderProducts();
    }
    /* FAVORITES */
    function toggleFavorite(event, id) {
        event.stopPropagation();
        const key = `favorite_${id}`;
        const current =
            localStorage.getItem(key) === "true";
        localStorage.setItem(
            key,
            (!current).toString()
        );
        renderProducts();
    }
    /* PRODUCT */
    function openProduct(id) {
        currentProduct =
            products.find(product =>
                product.id === id
            );
        quantity = 1;
        document.getElementById("quantity").textContent =
            quantity;
        document.getElementById("modalImage").src =
            currentProduct.image;
        document.getElementById("modalTitle").textContent =
            currentProduct.name;
        document.getElementById("modalPrice").textContent =
            currentProduct.price.toLocaleString("ru-RU") + " ₽";
        document.getElementById("modalStock").textContent =
            currentProduct.stock > 0
                ? `В наличии: ${currentProduct.stock} шт.`
                : "Нет в наличии";
        document.getElementById("modalDescription").textContent =
            currentProduct.description;
        document.getElementById("addButton").disabled =
            currentProduct.stock === 0;
        document
            .getElementById("productModal")
            .classList.add("active");
    }
    function closeProduct() {
        document
            .getElementById("productModal")
            .classList.remove("active");
    }
    /* QUANTITY */
    function changeQuantity(change) {
        if (!currentProduct) {
            return;
        }
        quantity += change;
        if (quantity < 1) {
            quantity = 1;
        }
        if (quantity > currentProduct.stock) {
            quantity = currentProduct.stock;
        }
        document.getElementById("quantity").textContent =
            quantity;
    }
    /* CART */
    function addToCart() {
        if (!currentProduct) {
            return;
        }
        const existing =
            cart.find(item =>
                item.product.id === currentProduct.id
            );
        if (existing) {
            existing.quantity += quantity;
            if (
                existing.quantity >
                currentProduct.stock
            ) {
                existing.quantity =
                    currentProduct.stock;
            }
        } else {
            cart.push({
                product: currentProduct,
                quantity: quantity
            });
        }
        updateCart();
        closeProduct();
        tg.showAlert("Товар добавлен в корзину ✓");
    }
    function updateCart() {
        const count =
            cart.reduce(
                (sum, item) =>
                    sum + item.quantity,
                0
            );
        document.getElementById("cartCount").textContent =
            count;
    }
    function openCart() {
        renderCart();
        document
            .getElementById("cartModal")
            .classList.add("active");
    }
    function closeCart() {
        document
            .getElementById("cartModal")
            .classList.remove("active");
    }
    function renderCart() {
        const container =
document.getElementById("cartItems");
        container.innerHTML = "";
        if (cart.length === 0) {
            container.innerHTML = `
                <div class="empty-cart">
                    Корзина пока пустая 🛒
                </div>
            `;
            document.getElementById("totalPrice").textContent =
                "0 ₽";
            return;
        }
        cart.forEach((item, index) => {
            container.innerHTML += `
                <div class="cart-item">
                    <img
                        src="${item.product.image}"
                        alt="${item.product.name}"
                    >
                    <div class="cart-item-info">
                        <div class="cart-item-name">
                            ${item.product.name}
                        </div>
                        <div class="cart-item-price">
                            ${item.product.price.toLocaleString("ru-RU")} ₽
                        </div>
                        <div class="cart-controls">
                            <button
                                onclick="changeCartQuantity(${index}, -1)"
                            >
                                −
                            </button>
                            <span>
                                ${item.quantity}
                            </span>
                            <button
                                onclick="changeCartQuantity(${index}, 1)"
                            >
                                +
                            </button>
                            <button
                                class="remove"
                                onclick="removeFromCart(${index})"
                            >
                                ×
                            </button>
                        </div>
                    </div>
                </div>
            `;
        });
        updateTotal();
    }
    function changeCartQuantity(index, change) {
        cart[index].quantity += change;
        if (cart[index].quantity <= 0) {
            cart.splice(index, 1);
        } else if (
            cart[index].quantity >
            cart[index].product.stock
        ) {
            cart[index].quantity =
                cart[index].product.stock;
        }
        updateCart();
        renderCart();
    }
    function removeFromCart(index) {
        cart.splice(index, 1);
        updateCart();
        renderCart();
    }
    /* TOTAL */
    function updateTotal() {
        let total =
            cart.reduce(
                (sum, item) =>
                    sum +
                    item.product.price *
                    item.quantity,
                0
            );
        if (promoDiscount > 0) {
            total =
                total -
                Math.round(
                    total * promoDiscount
                );
        }
        document.getElementById("totalPrice").textContent =
            total.toLocaleString("ru-RU") + " ₽";
    }
    /* PROMO */
    function applyPromo() {
        const code =
            document
                .getElementById("promoInput")
                .value
                .trim()
                .toUpperCase();
        const message =
            document.getElementById("promoMessage");
        if (code === "FIRST") {
            promoDiscount = 0.10;
            message.textContent =
                "Промокод применён: скидка 10% ✓";
            updateTotal();
        } else {
            promoDiscount = 0;
            message.textContent =
                "Промокод не найден";
            updateTotal();
        }
    }
    /* CHECKOUT */
    function checkout() {
        if (cart.length === 0) {
            tg.showAlert(
                "Корзина пустая"
            );
            return;
        }
        tg.showAlert(
            "Оформление заказа подключим следующим этапом."
        );
    }
    /* START */
renderProducts();
    updateCart();
</script>
