<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MY STORE</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --bg: #09090c;
            --card: #121217;
            --card2: #18181f;
            --text: #ffffff;
            --muted: #8f8f9b;
            --border: #25252e;
            --accent: #a855f7;
            --accent2: #ec4899;
            --danger: #ff4d67;
            --warning: #ffad42;
            --success: #53d769;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0 14px 40px;
            background:
                radial-gradient(
                    circle at 85% 0%,
                    rgba(168, 85, 247, 0.10),
                    transparent 30%
                ),
                var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            position: sticky;
            top: 0;
            z-index: 10;

            padding: 16px 0 12px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(9, 9, 12, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .logo {
            font-family:
                Impact,
                Haettenschweiler,
                "Arial Narrow Bold",
                sans-serif;

            font-size: 25px;
            letter-spacing: 1px;

            background:
                linear-gradient(
                    135deg,
                    #ffffff 20%,
                    #c084fc 55%,
                    #ec4899 100%
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            user-select: none;
        }

        .subtitle {
            margin-top: 2px;
            color: #666672;
            font-size: 8px;
            letter-spacing: 2px;
        }

        .brand {
            display: flex;
            flex-direction: column;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .header-button {
            position: relative;

            width: 42px;
            height: 42px;

            border: 1px solid var(--border);
            border-radius: 12px;

            background: rgba(18, 18, 23, 0.95);
            color: white;

            font-size: 19px;
            cursor: pointer;

            transition:
                transform 0.18s ease,
                border-color 0.18s ease,
                background 0.18s ease;
        }

        .header-button:active {
            transform: scale(0.91);
        }

        .header-button:hover {
            border-color: rgba(168, 85, 247, 0.55);
        }

        .cart-button {
            position: relative;
        }

        .cart-count {
            position: absolute;

            top: -5px;
            right: -5px;

            min-width: 19px;
            height: 19px;

            padding: 0 4px;

            border-radius: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent2)
                );

            color: white;
            font-size: 10px;
            font-weight: bold;

            transition: transform 0.2s ease;
        }

        .cart-count.bump {
            animation: cartBump 0.4s ease;
        }

        @keyframes cartBump {
            0% {
                transform: scale(1);
            }

            45% {
                transform: scale(1.45);
            }

            100% {
                transform: scale(1);
            }
        }

        /* =========================
           SEARCH
        ========================= */

        .search {
            display: none;
            margin: 5px 0 14px;
        }

        .search.active {
            display: block;
            animation: searchOpen 0.25s ease;
        }

        @keyframes searchOpen {
            from {
                opacity: 0;
                transform: translateY(-7px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .search-wrapper {
            position: relative;
        }

        .search input {
            width: 100%;

            padding: 14px 44px 14px 15px;

            border: 1px solid var(--border);
            border-radius: 13px;

            background: var(--card);
            color: white;

            outline: none;
            font-size: 15px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .search input:focus {
            border-color: rgba(168, 85, 247, 0.65);

            box-shadow:
                0 0 0 3px
                rgba(168, 85, 247, 0.08);
        }

        .search input::placeholder {
            color: var(--muted);
        }

        .search-clear {
            position: absolute;

            right: 8px;
            top: 50%;

            transform: translateY(-50%);

            width: 32px;
            height: 32px;

            border: none;
            border-radius: 9px;

            background: transparent;
            color: #777783;

            cursor: pointer;
        }

        /* =========================
           CATEGORIES
        ========================= */

        .categories {
            display: flex;
            gap: 8px;

            overflow-x: auto;

            padding: 3px 0 14px;

            scrollbar-width: none;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .category {
            flex-shrink: 0;

            min-width: 48px;

            border: 1px solid var(--border);
            border-radius: 12px;

            padding: 10px 15px;

            background: var(--card);
            color: #a5a5b0;

            font-size: 13px;
            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.18s ease,
                background 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease;
        }

        .category:active {
            transform: scale(0.93);
        }

        .category.active {
            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent2)
                );

            color: white;
            border-color: transparent;
        }

        /* =========================
           TOOLBAR
        ========================= */

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 12px;
        }

        .products-count {
            color: var(--muted);
            font-size: 12px;
        }

        .sort {
            padding: 9px 10px;

            border: 1px solid var(--border);
            border-radius: 10px;

            background: var(--card);
            color: #ddd;

            outline: none;
            font-size: 12px;
        }

        /* =========================
           PRODUCTS
        ========================= */

        .products {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 10px;
        }

        .product {
            position: relative;

            overflow: hidden;

            border: 1px solid var(--border);
            border-radius: 16px;

            background: var(--card);

            cursor: pointer;

            opacity: 0;
            transform: translateY(14px);

            animation: productAppear 0.45s ease forwards;

            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .product:nth-child(2) {
            animation-delay: 0.04s;
        }

        .product:nth-child(3) {
            animation-delay: 0.08s;
        }

        .product:nth-child(4) {
            animation-delay: 0.12s;
        }

        .product:nth-child(5) {
            animation-delay: 0.16s;
        }

        .product:nth-child(6) {
            animation-delay: 0.20s;
        }

        @keyframes productAppear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .product:hover {
            transform: translateY(-3px);

            border-color:
                rgba(168, 85, 247, 0.5);

            box-shadow:
                0 12px 30px
                rgba(0, 0, 0, 0.35);
        }

        .product:active {
            transform: scale(0.975);
        }

        /* =========================
           PRODUCT IMAGE
        ========================= */

        .product-image-wrapper {
            position: relative;

            width: 100%;

            aspect-ratio: 1 / 1;

            overflow: hidden;

            background: #101015;
        }

        .product-image {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;

            transition:
                transform 0.35s ease;
        }

        .product:hover .product-image {
            transform: scale(1.045);
        }

        .badge {
            position: absolute;

            left: 8px;
            top: 8px;

            z-index: 2;

            padding: 5px 7px;

            border-radius: 7px;

            background: rgba(0, 0, 0, 0.75);

            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.3px;
        }

        .badge.sale {
            background:
                linear-gradient(
                    135deg,
                    #ec4899,
                    #a855f7
                );
        }

        .badge.last {
            background: #b9364e;
        }

        /* =========================
           PRODUCT INFO
        ========================= */

        .product-info {
            padding: 10px;
        }

        .product-name {
            font-size: 14px;
            font-weight: 700;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-price {
            margin-top: 5px;

            display: flex;
            align-items: center;
            gap: 6px;

            font-size: 15px;
            font-weight: 800;
        }

        .old-price {
            color: #777783;

            font-size: 11px;
            font-weight: 500;

            text-decoration: line-through;
        }

        .product-stock {
            margin-top: 5px;

            color: var(--muted);

            font-size: 11px;
        }

        .product-stock.good {
            color: #9b9ba6;
        }

        .product-stock.low {
            color: var(--warning);
        }

        .product-stock.none {
            color: var(--danger);
        }

        /* =========================
           SKELETON
        ========================= */

        .skeleton {
            overflow: hidden;

            border-radius: 16px;

            background: var(--card);
            border: 1px solid var(--border);
        }

        .skeleton-image {
            aspect-ratio: 1 / 1;

            background:
                linear-gradient(
                    90deg,
                    #111116 25%,
                    #1b1b22 50%,
                    #111116 75%
                );

            background-size: 200% 100%;

            animation:
                skeletonLoading 1.3s infinite;
        }

        .skeleton-info {
            padding: 10px;
        }

        .skeleton-line {
            height: 12px;

            border-radius: 5px;

            margin-bottom: 8px;

            background:
                linear-gradient(
                    90deg,
                    #111116 25%,
                    #1b1b22 50%,
                    #111116 75%
                );

            background-size: 200% 100%;

            animation:
                skeletonLoading 1.3s infinite;
        }

        .skeleton-line.short {
            width: 55%;
        }

        @keyframes skeletonLoading {
            from {
                background-position: 200% 0;
            }

            to {
                background-position: -200% 0;
            }
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            display: none;

            position: fixed;

            inset: 0;

            z-index: 50;

            background:
                rgba(0, 0, 0, 0.78);

            align-items: flex-end;
        }

        .modal.active {
            display: flex;

            animation: modalBg 0.22s ease;
        }

        @keyframes modalBg {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal-content {
            width: 100%;

            max-height: 94vh;

            overflow-y: auto;

            padding: 15px 16px 25px;

            background: #101014;

            border-top:
                1px solid var(--border);

            border-radius:
                23px 23px 0 0;

            animation:
                modalSlide 0.3s ease;
        }

        @keyframes modalSlide {
            from {
                transform: translateY(100%);
            }

            to {
                transform: translateY(0);
            }
        }

        .modal-top {
            display: flex;
            justify-content: flex-end;

            margin-bottom: 5px;
        }

        .close-button {
            width: 35px;
            height: 35px;

            border: none;
            border-radius: 50%;

            background: #24242c;
            color: white;

            font-size: 20px;

            cursor: pointer;

            transition:
                transform 0.18s ease;
        }

        .close-button:active {
            transform: scale(0.88);
        }

        /* =========================
           GALLERY
        ========================= */

        .gallery {
            position: relative;

            overflow: hidden;

            border-radius: 17px;

            background: #0b0b0f;

            touch-action: pan-y;
        }

        .gallery-image {
            width: 100%;

            height: min(68vh, 500px);

            object-fit: cover;

            display: block;

            user-select: none;

            -webkit-user-drag: none;

            transition:
                opacity 0.18s ease,
                transform 0.25s ease;
        }

        .gallery-image.change {
            opacity: 0;
            transform: scale(0.985);
        }

        .gallery-arrow {
            position: absolute;

            top: 50%;

            transform: translateY(-50%);

            width: 38px;
            height: 38px;

            border: 1px solid
                rgba(255, 255, 255, 0.12);

            border-radius: 50%;

            background:
                rgba(0, 0, 0, 0.55);

            color: white;

            font-size: 21px;

            cursor: pointer;

            z-index: 3;
        }

        .gallery-arrow.left {
            left: 10px;
        }

        .gallery-arrow.right {
            right: 10px;
        }

        .gallery-dots {
            display: flex;
            justify-content: center;

            gap: 5px;

            margin-top: 9px;
        }

        .gallery-dot {
            width: 6px;
            height: 6px;

            border: none;
            border-radius: 50%;

            background: #44444d;

            padding: 0;

            transition:
                width 0.2s ease,
                background 0.2s ease;
        }

        .gallery-dot.active {
            width: 18px;

            border-radius: 8px;

            background:
                linear-gradient(
                    90deg,
                    var(--accent),
                    var(--accent2)
                );
        }

        /* =========================
           PRODUCT MODAL INFO
        ========================= */

        .modal-title {
            margin: 15px 0 5px;

            font-size: 24px;
        }

        .modal-price {
            display: flex;
            align-items: center;
            gap: 8px;

            font-size: 20px;
            font-weight: 800;
        }

        .modal-old-price {
            color: #777783;

            font-size: 13px;

            text-decoration: line-through;
        }

        .modal-stock {
            margin-top: 7px;
            margin-bottom: 17px;

            color: var(--muted);

            font-size: 13px;
        }

        .description-title {
            margin-bottom: 7px;

            font-size: 14px;
            font-weight: 700;
        }

        .description {
            margin-bottom: 18px;

            color: #aaaab5;

            font-size: 14px;
            line-height: 1.55;
        }

        /* =========================
           QUANTITY
        ========================= */

        .quantity-title {
            margin-bottom: 8px;

            font-size: 14px;
            font-weight: 700;
        }

        .quantity {
            display: flex;
            align-items: center;

            gap: 12px;

            margin-bottom: 17px;
        }

        .quantity button {
            width: 38px;
            height: 38px;

            border: 1px solid var(--border);
            border-radius: 10px;

            background: var(--card);
            color: white;

            font-size: 18px;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }

        .quantity button:active {
            transform: scale(0.88);
        }

        .quantity span {
            min-width: 25px;

            text-align: center;

            font-weight: 800;
        }

        /* =========================
           BUTTONS
        ========================= */

        .add-button,
        .checkout-button {
            width: 100%;

            border: none;
            border-radius: 13px;

            padding: 15px;

            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent2)
                );

            color: white;

            font-size: 15px;
            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 8px 25px
                rgba(168, 85, 247, 0.16);

            transition:
                transform 0.18s ease,
                filter 0.18s ease;
        }

        .add-button:active,
        .checkout-button:active {
            transform: scale(0.97);
            filter: brightness(0.9);
        }

        .add-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;

            box-shadow: none;
        }

        .add-button.added {
            animation:
                addedAnimation 0.45s ease;
        }

        @keyframes addedAnimation {
            0% {
                transform: scale(1);
            }

            40% {
                transform: scale(0.96);
            }

            70% {
                transform: scale(1.02);
            }

            100% {
                transform: scale(1);
            }
        }

        /* =========================
           CART
        ========================= */

        .cart-item {
            display: flex;

            gap: 11px;

            padding: 12px 0;

            border-bottom:
                1px solid var(--border);

            animation:
                cartItemAppear 0.25s ease;
        }

        @keyframes cartItemAppear {
            from {
                opacity: 0;
                transform: translateX(-8px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .cart-item img {
            width: 72px;
            height: 72px;

            object-fit: cover;

            border-radius: 11px;
        }

        .cart-item-info {
            flex: 1;
            min-width: 0;
        }

        .cart-item-name {
            font-size: 14px;
            font-weight: 800;

            margin-bottom: 4px;
        }

        .cart-item-price {
            color: #aaaab5;

            font-size: 13px;
        }

        .cart-controls {
            display: flex;
            align-items: center;

            gap: 7px;

            margin-top: 8px;
        }

        .cart-controls button {
            width: 28px;
            height: 28px;

            border: 1px solid var(--border);
            border-radius: 7px;

            background: var(--card);
            color: white;

            cursor: pointer;
        }

        .cart-controls .remove {
            margin-left: auto;

            color: #ff6680;
        }

        .empty-cart {
            padding: 55px 20px;

            text-align: center;

            color: var(--muted);

            line-height: 1.6;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;

            margin: 20px 0;

            font-size: 19px;
            font-weight: 800;
        }

        .cart-discount {
            color: #b7b7c1;

            font-size: 12px;

            margin-top: -12px;
            margin-bottom: 12px;
        }

        /* =========================
           PROMO
        ========================= */

        .promo {
            display: flex;

            gap: 7px;

            margin-top: 4px;
        }

        .promo input {
            flex: 1;

            min-width: 0;

            padding: 12px;

            border: 1px solid var(--border);
            border-radius: 10px;

            background: var(--card);
            color: white;

            outline: none;
        }

        .promo button {
            padding: 0 14px;

            border: 1px solid var(--border);
            border-radius: 10px;

            background: var(--card2);
            color: white;

            cursor: pointer;
        }

        .promo-message {
            min-height: 18px;

            margin-top: 7px;

            color: var(--muted);

            font-size: 12px;
        }

        .promo-message.success {
            color: var(--success);
        }

        .promo-message.error {
            color: var(--danger);
        }

        /* =========================
           NO RESULTS
        ========================= */

        .no-results {
            grid-column: 1 / -1;

            padding: 55px 15px;

            text-align: center;

            color: var(--muted);

            animation:
                productAppear 0.3s ease forwards;
        }

        .no-results-title {
            margin-bottom: 7px;

            color: white;

            font-size: 17px;
            font-weight: 800;
        }

        .no-results-text {
            font-size: 13px;
            line-height: 1.5;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (min-width: 700px) {

            body {
                max-width: 1100px;

                margin: auto;
            }

            .products {
                grid-template-columns:
                    repeat(4, minmax(0, 1fr));

                gap: 13px;
            }

            .modal-content {
                max-width: 650px;

                margin: auto;

                border-radius: 23px;

                margin-bottom: 20px;
            }

            .modal {
                align-items: center;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="brand">

        <div class="logo">
            MY STORE
        </div>

        <div class="subtitle">
            CLOTHING & ACCESSORIES
        </div>

    </div>

    <div class="header-actions">

        <button
            class="header-button"
            onclick="toggleSearch()"
            aria-label="Поиск"
        >
            ⌕
        </button>

        <button
            class="header-button cart-button"
            onclick="openCart()"
            aria-label="Корзина"
        >
            🛒

            <span
                class="cart-count"
                id="cartCount"
            >
                0
            </span>

        </button>

    </div>

</header>


<!-- SEARCH -->

<div
    class="search"
    id="searchBox"
>

    <div class="search-wrapper">

        <input
            type="text"
            id="searchInput"
            placeholder="Найти товар..."
            autocomplete="off"
            oninput="searchProducts()"
        >

        <button
            class="search-clear"
            onclick="clearSearch()"
        >
            ×
        </button>

    </div>

</div>


<!-- CATEGORIES -->

<div class="categories">

    <button
        class="category active"
        onclick="setCategory('all', this)"
    >
        1
    </button>

    <button
        class="category"
        onclick="setCategory('cat2', this)"
    >
        2
    </button>

    <button
        class="category"
        onclick="setCategory('cat3', this)"
    >
        3
    </button>

    <button
        class="category"
        onclick="setCategory('cat4', this)"
    >
        4
    </button>

    <button
        class="category"
        onclick="setCategory('cat5', this)"
    >
        5
    </button>

    <button
        class="category"
        onclick="setCategory('cat6', this)"
    >
        6
    </button>

</div>


<!-- TOOLBAR -->

<div class="toolbar">

    <div
        class="products-count"
        id="productsCount"
    >
    </div>

    <select
        class="sort"
        id="sortSelect"
        onchange="sortProducts()"
    >

        <option value="popular">
            Популярное
        </option>

        <option value="cheap">
            Сначала дешевле
        </option>

        <option value="expensive">
            Сначала дороже
        </option>

    </select>

</div>


<!-- PRODUCTS -->

<div
    class="products"
    id="products"
>
</div>


<!-- PRODUCT MODAL -->

<div
    class="modal"
    id="productModal"
>

    <div class="modal-content">

        <div class="modal-top">

            <button
                class="close-button"
                onclick="closeProduct()"
            >
                ×
            </button>

        </div>


        <!-- GALLERY -->

        <div
            class="gallery"
            id="gallery"
        >

            <img
                class="gallery-image"
                id="modalImage"
                draggable="false"
            >

            <button
                class="gallery-arrow left"
                onclick="changeGallery(-1)"
            >
                ‹
            </button>

            <button
                class="gallery-arrow right"
                onclick="changeGallery(1)"
            >
                ›
            </button>

        </div>


        <div
            class="gallery-dots"
            id="galleryDots"
        >
        </div>


        <h2
            class="modal-title"
            id="modalTitle"
        >
        </h2>


        <div
            class="modal-price"
            id="modalPrice"
        >
        </div>


        <div
            class="modal-stock"
            id="modalStock"
        >
        </div>


        <div class="description-title">
            Описание
        </div>


        <div
            class="description"
            id="modalDescription"
        >
        </div>


        <div class="quantity-title">
            Количество
        </div>


        <div class="quantity">

            <button
                onclick="changeQuantity(-1)"
            >
                −
            </button>

            <span id="quantity">
                1
            </span>

            <button
                onclick="changeQuantity(1)"
            >
                +
            </button>

        </div>


        <button
            class="add-button"
            id="addButton"
            onclick="addToCart()"
        >
            Добавить в корзину
        </button>

    </div>

</div>


<!-- CART MODAL -->

<div
    class="modal"
    id="cartModal"
>

    <div class="modal-content">

        <div class="modal-top">

            <button
                class="close-button"
                onclick="closeCart()"
            >
                ×
            </button>

        </div>


        <h2>
            Корзина 🛒
        </h2>


        <div id="cartItems">
        </div>


        <div class="promo">

            <input
                id="promoInput"
                placeholder="Промокод"
                autocomplete="off"
            >

            <button
                onclick="applyPromo()"
            >
                Применить
            </button>

        </div>


        <div
            class="promo-message"
            id="promoMessage"
        >
        </div>


        <div
            class="cart-discount"
            id="cartDiscount"
        >
        </div>


        <div class="cart-total">

            <span>
                Итого
            </span>

            <span id="totalPrice">
                0 ₽
            </span>

        </div>


        <button
            class="checkout-button"
            onclick="checkout()"
        >
            Оформить заказ
        </button>

    </div>

</div>


<script src="products.js"></script>


<script>

    /* =========================
       TELEGRAM
    ========================= */

    const tg =
        window.Telegram &&
        window.Telegram.WebApp
            ? window.Telegram.WebApp
            : null;

    if (tg) {
        tg.ready();
        tg.expand();
    }


    /* =========================
       STATE
    ========================= */

    let currentCategory = "all";

    let currentProduct = null;

    let quantity = 1;

    let galleryIndex = 0;

    let promoDiscount = 0;

    let cart = [];


    /* =========================
       LOAD CART
    ========================= */

    function loadCart() {

        try {

            const saved =
                localStorage.getItem(
                    "myStoreCart"
                );

            if (saved) {

                const parsed =
                    JSON.parse(saved);

                cart =
                    parsed.filter(item => {

                        const product =
                            products.find(
                                p =>
                                    p.id ===
                                    item.product.id
                            );

                        if (!product) {
                            return false;
                        }

                        item.product =
                            product;

                        if (
                            item.quantity >
                            product.stock
                        ) {
                            item.quantity =
                                product.stock;
                        }

                        return (
                            item.quantity > 0
                        );

                    });

            }

        } catch (error) {

            cart = [];

        }

    }


    function saveCart() {

        localStorage.setItem(
            "myStoreCart",
            JSON.stringify(cart)
        );

    }


    /* =========================
       SKELETON
    ========================= */

    function showSkeletons() {

        const container =
            document.getElementById(
                "products"
            );

        container.innerHTML = "";

        for (
            let i = 0;
            i < 6;
            i++
        ) {

            container.innerHTML += `

                <div class="skeleton">

                    <div
                        class="skeleton-image"
                    ></div>

                    <div
                        class="skeleton-info"
                    >

                        <div
                            class="skeleton-line"
                        ></div>

                        <div
                            class="skeleton-line short"
                        ></div>

                    </div>

                </div>

            `;

        }

    }


    /* =========================
       PRODUCTS
    ========================= */

    function renderProducts() {

        let list = [...products];


        const searchInput =
            document.getElementById(
                "searchInput"
            );

        const search =
            searchInput
                ? searchInput.value
                    .toLowerCase()
                    .trim()
                : "";


        /* CATEGORY */

        if (
            currentCategory !==
            "all"
        ) {

            list =
                list.filter(
                    product =>
                        product.category ===
                        currentCategory
                );

        }


        /* SEARCH */

        if (search) {

            list =
                list.filter(product => {

                    const searchable = [

                        product.name,

                        product.description,

                        product.category

                    ]
                        .join(" ")
                        .toLowerCase();

                    return searchable
                        .includes(search);

                });

        }


        /* SORT */

        const sort =
            document.getElementById(
                "sortSelect"
            ).value;


        if (sort === "cheap") {

            list.sort(
                (a, b) =>
                    a.price - b.price
            );

        }


        if (sort === "expensive") {

            list.sort(
                (a, b) =>
                    b.price - a.price
            );

        }


        if (sort === "popular") {

            list.sort(
                (a, b) =>
                    b.popularity -
                    a.popularity
            );

        }


        const container =
            document.getElementById(
                "products"
            );


        container.innerHTML = "";


        document.getElementById(
            "productsCount"
        ).textContent =
            `${list.length} товаров`;


        /* NO RESULTS */

        if (
            list.length === 0
        ) {

            container.innerHTML = `

                <div class="no-results">

                    <div
                        class="no-results-title"
                    >
                        Товар сбежал 👀
                    </div>

                    <div
                        class="no-results-text"
                    >
                        Похоже, этот товар
                        решил спрятаться.
                        Попробуй другой запрос.
                    </div>

                </div>

            `;

            return;

        }


        /* CARDS */

        list.forEach(product => {

            let badge = "";


            if (product.sale) {

                badge = `

                    <div
                        class="badge sale"
                    >
                        СКИДКА
                    </div>

                `;

            }
            else if (
                product.stock === 0
            ) {

                badge = `

                    <div
                        class="badge last"
                    >
                        НЕТ В НАЛИЧИИ
                    </div>

                `;

            }
            else if (
                product.stock <= 2
            ) {

                badge = `

                    <div
                        class="badge last"
                    >
                        ПОСЛЕДНИЕ
                    </div>

                `;

            }


            let stockClass = "";

            let stockText = "";


            if (
                product.stock === 0
            ) {

                stockClass = "none";

                stockText =
                    "Нет в наличии";

            }
            else if (
                product.stock <= 3
            ) {

                stockClass = "low";

                stockText =
                    `Осталось: ${product.stock}`;

            }
            else {

                stockClass = "good";

                stockText =
                    `В наличии: ${product.stock}`;

            }


            let priceHTML = `

                <span>
                    ${product.price.toLocaleString("ru-RU")} ₽
                </span>

            `;


            if (
                product.sale &&
                product.oldPrice
            ) {

                priceHTML = `

                    <span>
                        ${product.price.toLocaleString("ru-RU")} ₽
                    </span>

                    <span
                        class="old-price"
                    >
                        ${product.oldPrice.toLocaleString("ru-RU")} ₽
                    </span>

                `;

            }


            container.innerHTML += `

                <div
                    class="product"
                    onclick="openProduct(${product.id})"
                >

                    <div
                        class="product-image-wrapper"
                    >

                        ${badge}

                        <img
                            class="product-image"
                            src="${product.image}"
                            alt="${product.name}"
                            loading="lazy"
                        >

                    </div>


                    <div
                        class="product-info"
                    >

                        <div
                            class="product-name"
                        >
                            ${product.name}
                        </div>


                        <div
                            class="product-price"
                        >
                            ${priceHTML}
                        </div>


                        <div
                            class="product-stock ${stockClass}"
                        >
                            ${stockText}
                        </div>

                    </div>

                </div>

            `;

        });

    }


    /* =========================
       CATEGORY
    ========================= */

    function setCategory(
        category,
        button
    ) {

        currentCategory =
            category;


        document
            .querySelectorAll(
                ".category"
            )
            .forEach(item => {

                item.classList.remove(
                    "active"
                );

            });


        button.classList.add(
            "active"
        );


        renderProducts();

    }


    /* =========================
       SEARCH
    ========================= */

    function toggleSearch() {

        const searchBox =
            document.getElementById(
                "searchBox"
            );


        searchBox.classList.toggle(
            "active"
        );


        if (
            searchBox.classList.contains(
                "active"
            )
        ) {

            document
                .getElementById(
                    "searchInput"
                )
                .focus();

        }

    }


    function searchProducts() {

        renderProducts();

    }


    function clearSearch() {

        const input =
            document.getElementById(
                "searchInput"
            );

        input.value = "";

        renderProducts();

        input.focus();

    }


    /* =========================
       SORT
    ========================= */

    function sortProducts() {

        renderProducts();

    }


    /* =========================
       PRODUCT MODAL
    ========================= */

    function openProduct(id) {

        currentProduct =
            products.find(
                product =>
                    product.id === id
            );


        if (!currentProduct) {
            return;
        }


        quantity = 1;

        galleryIndex = 0;


        document.getElementById(
            "quantity"
        ).textContent =
            quantity;


        document.getElementById(
            "modalTitle"
        ).textContent =
            currentProduct.name;


        /* PRICE */

        let priceHTML = `

            <span>
                ${currentProduct.price.toLocaleString("ru-RU")} ₽
            </span>

        `;


        if (
            currentProduct.sale &&
            currentProduct.oldPrice
        ) {

            priceHTML = `

                <span>
                    ${currentProduct.price.toLocaleString("ru-RU")} ₽
                </span>

                <span
                    class="modal-old-price"
                >
                    ${currentProduct.oldPrice.toLocaleString("ru-RU")} ₽
                </span>

            `;

        }


        document.getElementById(
            "modalPrice"
        ).innerHTML =
            priceHTML;


        /* STOCK */

        if (
            currentProduct.stock === 0
        ) {

            document.getElementById(
                "modalStock"
            ).textContent =
                "Нет в наличии";

        }
        else if (
            currentProduct.stock <= 3
        ) {

            document.getElementById(
                "modalStock"
            ).textContent =
                `Почти закончилось — осталось ${currentProduct.stock} шт.`;

        }
        else {

            document.getElementById(
                "modalStock"
            ).textContent =
                `В наличии: ${currentProduct.stock} шт.`;

        }


        document.getElementById(
            "modalDescription"
        ).textContent =
            currentProduct.description;


        document.getElementById(
            "addButton"
        ).disabled =
            currentProduct.stock === 0;


        renderGallery();


        document.getElementById(
            "productModal"
        ).classList.add(
            "active"
        );

    }


    function closeProduct() {

        document.getElementById(
            "productModal"
        ).classList.remove(
            "active"
        );

        currentProduct = null;

    }


    /* =========================
       GALLERY
    ========================= */

    function renderGallery() {

        if (
            !currentProduct
        ) {
            return;
        }


        const gallery =
            currentProduct.gallery &&
            currentProduct.gallery.length
                ? currentProduct.gallery
                : [
                    currentProduct.image
                ];


        if (
            galleryIndex >=
            gallery.length
        ) {

            galleryIndex = 0;

        }


        const image =
            document.getElementById(
                "modalImage"
            );


        image.classList.add(
            "change"
        );


        setTimeout(() => {

            image.src =
                gallery[galleryIndex];

            image.classList.remove(
                "change"
            );

        }, 100);


        const dots =
            document.getElementById(
                "galleryDots"
            );


        dots.innerHTML = "";


        gallery.forEach(
            (photo, index) => {

                dots.innerHTML += `

                    <button
                        class="
                            gallery-dot
                            ${
                                index ===
                                galleryIndex
                                    ? "active"
                                    : ""
                            }
                        "
                        onclick="
                            setGallery(${index})
                        "
                    ></button>

                `;

            }
        );

    }


    function setGallery(index) {

        galleryIndex =
            index;

        renderGallery();

    }


    function changeGallery(direction) {

        if (
            !currentProduct
        ) {
            return;
        }


        const gallery =
            currentProduct.gallery &&
            currentProduct.gallery.length
                ? currentProduct.gallery
                : [
                    currentProduct.image
                ];


        galleryIndex += direction;


        if (
            galleryIndex < 0
        ) {

            galleryIndex =
                gallery.length - 1;

        }


        if (
            galleryIndex >=
            gallery.length
        ) {

            galleryIndex = 0;

        }


        renderGallery();

    }


    /* =========================
       SWIPE GALLERY
    ========================= */

    let touchStartX = 0;

    let touchEndX = 0;


    const galleryElement =
        document.getElementById(
            "gallery"
        );


    galleryElement.addEventListener(
        "touchstart",
        event => {

            touchStartX =
                event.changedTouches[0].screenX;

        },
        {
            passive: true
        }
    );


    galleryElement.addEventListener(
        "touchend",
        event => {

            touchEndX =
                event.changedTouches[0].screenX;


            const difference =
                touchEndX -
                touchStartX;


            if (
                Math.abs(difference) <
                45
            ) {
                return;
            }


            if (
                difference < 0
            ) {

                changeGallery(1);

            }
            else {

                changeGallery(-1);

            }

        },
        {
            passive: true
        }
    );


    /* =========================
       QUANTITY
    ========================= */

    function changeQuantity(
        change
    ) {

        if (
            !currentProduct
        ) {
            return;
        }


        quantity += change;


        if (
            quantity < 1
        ) {

            quantity = 1;

        }


        if (
            quantity >
            currentProduct.stock
        ) {

            quantity =
                currentProduct.stock;

        }


        document.getElementById(
            "quantity"
        ).textContent =
            quantity;

    }


    /* =========================
       ADD TO CART
    ========================= */

    function addToCart() {

        if (
            !currentProduct ||
            currentProduct.stock === 0
        ) {

            return;

        }


        let existing =
            cart.find(
                item =>
                    item.product.id ===
                    currentProduct.id
            );


        if (existing) {

            existing.quantity +=
                quantity;


            if (
                existing.quantity >
                currentProduct.stock
            ) {

                existing.quantity =
                    currentProduct.stock;

            }

        }
        else {

            cart.push({

                product:
                    currentProduct,

                quantity:
                    quantity

            });

        }


        saveCart();

        updateCart();


        /* BUTTON ANIMATION */

        const button =
            document.getElementById(
                "addButton"
            );


        button.classList.remove(
            "added"
        );


        void button.offsetWidth;


        button.classList.add(
            "added"
        );


        button.textContent =
            "Добавлено ✓";


        setTimeout(() => {

            button.textContent =
                "Добавить в корзину";

        }, 850);


        /* CLOSE MODAL */

        setTimeout(() => {

            closeProduct();

        }, 300);

    }


    /* =========================
       CART COUNT
    ========================= */

    function updateCart() {

        const count =
            cart.reduce(
                (sum, item) =>
                    sum +
                    item.quantity,
                0
            );


        const counter =
            document.getElementById(
                "cartCount"
            );


        counter.textContent =
            count;


        counter.classList.remove(
            "bump"
        );


        void counter.offsetWidth;


        if (count > 0) {

            counter.classList.add(
                "bump"
            );

        }

    }


    /* =========================
       CART
    ========================= */

    function openCart() {

        renderCart();


        document.getElementById(
            "cartModal"
        ).classList.add(
            "active"
        );

    }


    function closeCart() {

        document.getElementById(
            "cartModal"
        ).classList.remove(
            "active"
        );

    }


    function renderCart() {

        const container =
            document.getElementById(
                "cartItems"
            );


        container.innerHTML = "";


        if (
            cart.length === 0
        ) {

            container.innerHTML = `

                <div class="empty-cart">

                    🛒

                    <br>

                    Корзина пока пустая.

                    <br>

                    Добавь что-нибудь
                    интересное.

                </div>

            `;


            document.getElementById(
                "totalPrice"
            ).textContent =
                "0 ₽";


            document.getElementById(
                "cartDiscount"
            ).textContent =
                "";


            return;

        }


        cart.forEach(
            (item, index) => {

                container.innerHTML += `

                    <div
                        class="cart-item"
                    >

                        <img
                            src="${item.product.image}"
                            alt="${item.product.name}"
                        >


                        <div
                            class="cart-item-info"
                        >

                            <div
                                class="cart-item-name"
                            >
                                ${item.product.name}
                            </div>


                            <div
                                class="cart-item-price"
                            >
                                ${item.product.price.toLocaleString("ru-RU")} ₽
                                ×
                                ${item.quantity}
                            </div>


                            <div
                                class="cart-controls"
                            >

                                <button
                                    onclick="
                                        changeCartQuantity(
                                            ${index},
                                            -1
                                        )
                                    "
                                >
                                    −
                                </button>


                                <span>
                                    ${item.quantity}
                                </span>


                                <button
                                    onclick="
                                        changeCartQuantity(
                                            ${index},
                                            1
                                        )
                                    "
                                >
                                    +
                                </button>


                                <button
                                    class="remove"
                                    onclick="
                                        removeFromCart(
                                            ${index}
                                        )
                                    "
                                >
                                    ×
                                </button>

                            </div>

                        </div>

                    </div>

                `;

            }
        );


        updateTotal();

    }


    /* =========================
       CART QUANTITY
    ========================= */

    function changeCartQuantity(
        index,
        change
    ) {

        const item =
            cart[index];


        if (!item) {
            return;
        }


        item.quantity +=
            change;


        if (
            item.quantity <= 0
        ) {

            cart.splice(
                index,
                1
            );

        }


        if (
            cart[index] &&
            cart[index].quantity >
            cart[index].product.stock
        ) {

            cart[index].quantity =
                cart[index].product.stock;

        }


        saveCart();

        updateCart();

        renderCart();

    }


    function removeFromCart(
        index
    ) {

        cart.splice(
            index,
            1
        );


        saveCart();

        updateCart();

        renderCart();

    }


    /* =========================
       TOTAL
    ========================= */

    function calculateSubtotal() {

        return cart.reduce(
            (sum, item) =>
                sum +
                item.product.price *
                item.quantity,
            0
        );

    }


    function updateTotal() {

        const subtotal =
            calculateSubtotal();


        const discount =
            Math.round(
                subtotal *
                promoDiscount
            );


        const total =
            subtotal -
            discount;


        document.getElementById(
            "totalPrice"
        ).textContent =
            total.toLocaleString(
                "ru-RU"
            ) + " ₽";


        const discountElement =
            document.getElementById(
                "cartDiscount"
            );


        if (
            discount > 0
        ) {

            discountElement.textContent =
                `Скидка: −${discount.toLocaleString("ru-RU")} ₽`;

        }
        else {

            discountElement.textContent =
                "";

        }

    }


    /* =========================
       PROMO
    ========================= */

    function applyPromo() {

        const input =
            document.getElementById(
                "promoInput"
            );


        const code =
            input.value
                .trim()
                .toUpperCase();


        const message =
            document.getElementById(
                "promoMessage"
            );


        if (
            code === "FIRST"
        ) {

            promoDiscount =
                0.10;


            message.textContent =
                "Промокод применён — скидка 10% ✓";


            message.className =
                "promo-message success";


            updateTotal();

        }
        else {

            promoDiscount =
                0;


            message.textContent =
                "Такого промокода нет";


            message.className =
                "promo-message error";


            updateTotal();

        }

    }


    /* =========================
       CHECKOUT
    ========================= */

    function checkout() {

        if (
            cart.length === 0
        ) {

            showAlert(
                "Корзина пустая"
            );

            return;

        }


        showAlert(
            "Оформление заказа подключим следующим этапом."
        );

    }


    /* =========================
       TELEGRAM ALERT
    ========================= */

    function showAlert(
        text
    ) {

        if (
            tg &&
            tg.showAlert
        ) {

            tg.showAlert(
                text
            );

        }
        else {

            alert(text);

        }

    }


    /* =========================
       CLOSE MODALS ON BACKDROP
    ========================= */

    document
        .getElementById(
            "productModal"
        )
        .addEventListener(
            "click",
            event => {

                if (
                    event.target.id ===
                    "productModal"
                ) {

                    closeProduct();

                }

            }
        );


    document
        .getElementById(
            "cartModal"
        )
        .addEventListener(
            "click",
            event => {

                if (
                    event.target.id ===
                    "cartModal"
                ) {

                    closeCart();

                }

            }
        );


    /* =========================
       ESC
    ========================= */

    document.addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Escape"
            ) {

                closeProduct();

                closeCart();

            }

        }
    );


    /* =========================
       START
    ========================= */

    showSkeletons();


    setTimeout(() => {

        loadCart();

        renderProducts();

        updateCart();

    }, 450);

</script>

</body>
</html>
