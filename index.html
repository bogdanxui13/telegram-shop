<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MY STORE</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;

    background: #0b0b0f;
    color: #ffffff;

    font-family: Arial, sans-serif;
}

button,
input,
select {
    font-family: inherit;
}


/* =========================
   HEADER
========================= */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 25px;
}

.logo h1 {
    margin: 0;

    font-size: 26px;
    letter-spacing: 2px;
}

.logo p {
    margin: 5px 0 0;

    color: #777;
    font-size: 11px;
    letter-spacing: 2px;
}

.cart-button {
    position: relative;

    width: 48px;
    height: 48px;

    border: 1px solid #292933;
    border-radius: 14px;

    background: #15151c;
    color: #fff;

    font-size: 20px;

    transition: .2s;
}

.cart-button:hover {
    border-color: #a855f7;
}

.cart-count {
    position: absolute;

    top: -6px;
    right: -6px;

    min-width: 20px;
    height: 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0 5px;

    border-radius: 20px;

    background: #a855f7;

    color: white;

    font-size: 11px;
    font-weight: bold;
}

.cart-count.hidden {
    display: none;
}


/* =========================
   SEARCH
========================= */

.search {
    margin-bottom: 15px;
}

.search input {
    width: 100%;

    padding: 14px 16px;

    border: 1px solid #292933;
    border-radius: 12px;

    background: #15151c;
    color: #fff;

    outline: none;

    font-size: 14px;
}

.search input:focus {
    border-color: #a855f7;
}

.search input::placeholder {
    color: #666;
}


/* =========================
   CATEGORIES
========================= */

.categories {
    display: flex;

    flex-direction: row;

    align-items: center;

    gap: 8px;

    width: 100%;

    overflow-x: auto;

    margin-bottom: 15px;
    padding: 2px 0 6px;
}

.categories::-webkit-scrollbar {
    display: none;
}

.category {
    flex: 0 0 auto;

    width: auto;
    min-width: 48px;

    padding: 10px 16px;

    border: 1px solid #292933;
    border-radius: 12px;

    background: #15151c;
    color: #aaa;

    font-size: 13px;

    cursor: pointer;

    transition: .2s;
}

.category:hover {
    border-color: #a855f7;
    color: #fff;
}

.category.active {
    background: #a855f7;
    border-color: #a855f7;

    color: white;
}


/* =========================
   SORT
========================= */

.sort-row {
    display: flex;

    justify-content: flex-end;

    margin-bottom: 18px;
}

.sort-select {
    padding: 9px 12px;

    border: 1px solid #292933;
    border-radius: 10px;

    background: #15151c;
    color: #aaa;

    outline: none;
}


/* =========================
   PRODUCTS
========================= */

.products {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 12px;
}

.product {
    position: relative;

    padding: 8px;

    overflow: hidden;

    border: 1px solid #24242d;
    border-radius: 16px;

    background: #121218;

    animation: productAppear .3s ease;

    transition: .2s;
}

.product:hover {
    transform: translateY(-3px);

    border-color: #383842;
}

@keyframes productAppear {

    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

.product-image {
    position: relative;

    overflow: hidden;

    border-radius: 12px;

    cursor: pointer;
}

.product img {
    display: block;

    width: 100%;
    height: 230px;

    object-fit: cover;

    border-radius: 12px;

    transition: .3s;
}

.product:hover img {
    transform: scale(1.02);
}

.sale-badge {
    position: absolute;

    top: 8px;
    left: 8px;

    padding: 5px 8px;

    border-radius: 7px;

    background: #a855f7;

    color: white;

    font-size: 10px;
    font-weight: bold;
}

.stock-badge {
    position: absolute;

    bottom: 8px;
    left: 8px;

    padding: 5px 8px;

    border-radius: 7px;

    background: rgba(0,0,0,.8);

    color: white;

    font-size: 10px;
}

.product h2 {
    margin: 10px 3px 5px;

    font-size: 15px;
}

.price {
    margin: 0 3px;

    font-size: 16px;
    font-weight: bold;
}

.old-price {
    margin-left: 5px;

    color: #666;

    font-size: 11px;

    text-decoration: line-through;
}

.product-stock {
    margin: 5px 3px 9px;

    color: #777;

    font-size: 11px;
}

.product button {
    width: 100%;

    padding: 10px;

    border: none;
    border-radius: 10px;

    background: #a855f7;
    color: white;

    font-size: 13px;
    font-weight: bold;

    cursor: pointer;
}

.product button:hover {
    background: #9333ea;
}

.product button:disabled {
    background: #292933;
    color: #666;

    cursor: not-allowed;
}


/* SOLD OUT */

.product.sold-out {
    opacity: .65;
}

.product.sold-out img {
    filter: grayscale(1);
    opacity: .5;
}

.sold-overlay {
    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 12px;

    background: rgba(0,0,0,.35);

    color: white;

    font-size: 13px;
    font-weight: bold;
}


/* =========================
   NO RESULTS
========================= */

.no-results {
    display: none;

    padding: 50px 20px;

    text-align: center;

    color: #666;
}

.no-results-icon {
    font-size: 35px;
}


/* =========================
   MODALS
========================= */

.modal {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    align-items: flex-end;
    justify-content: center;

    background: rgba(0,0,0,.75);
}

.modal.active {
    display: flex;
}

.modal-content {
    width: 100%;
    max-width: 600px;

    max-height: 92vh;

    overflow-y: auto;

    padding: 20px;

    border-radius: 22px 22px 0 0;

    background: #111117;

    animation: modalUp .25s ease;
}

@keyframes modalUp {

    from {
        transform: translateY(100%);
    }

    to {
        transform: translateY(0);
    }

}

.modal-top {
    display: flex;

    align-items: center;
    justify-content: space-between;

    margin-bottom: 15px;
}

.modal-top h2 {
    margin: 0;

    font-size: 20px;
}

.close {
    width: 36px;
    height: 36px;

    border: none;
    border-radius: 10px;

    background: #20202a;
    color: white;

    font-size: 20px;
}


/* =========================
   PRODUCT GALLERY
========================= */

.gallery {
    position: relative;
}

.gallery img {
    width: 100%;
    height: 380px;

    object-fit: cover;

    border-radius: 14px;
}

.gallery-arrow {
    position: absolute;

    top: 50%;

    width: 38px;
    height: 38px;

    transform: translateY(-50%);

    border: none;
    border-radius: 50%;

    background: rgba(0,0,0,.65);

    color: white;

    font-size: 20px;
}

.gallery-prev {
    left: 10px;
}

.gallery-next {
    right: 10px;
}

.gallery-dots {
    display: flex;

    justify-content: center;

    gap: 6px;

    margin-top: 10px;
}

.gallery-dot {
    width: 6px;
    height: 6px;

    padding: 0;

    border: none;
    border-radius: 50%;

    background: #444;
}

.gallery-dot.active {
    background: #a855f7;
}


/* =========================
   CART
========================= */

.cart-header {
    display: flex;

    align-items: center;
    justify-content: space-between;

    margin-bottom: 15px;
}

.cart-header h2 {
    margin: 0;
}

.clear-cart {
    border: none;

    background: none;

    color: #777;

    font-size: 12px;
}

.cart-empty {
    padding: 45px 15px;

    text-align: center;

    color: #666;
}

.cart-empty-icon {
    margin-bottom: 10px;

    font-size: 42px;
}

.cart-item {
    display: grid;

    grid-template-columns:
        70px 1fr auto;

    gap: 12px;

    padding: 12px 0;

    border-bottom: 1px solid #24242d;
}

.cart-item img {
    width: 70px;
    height: 85px;

    object-fit: cover;

    border-radius: 10px;
}

.cart-item-name {
    margin-bottom: 5px;

    font-size: 14px;
    font-weight: bold;
}

.cart-item-price {
    margin-bottom: 8px;

    color: #aaa;

    font-size: 12px;
}

.cart-item-total {
    margin-bottom: 8px;

    font-size: 14px;
    font-weight: bold;
}

.quantity {
    display: flex;

    align-items: center;

    gap: 8px;
}

.quantity button {
    width: 28px;
    height: 28px;

    border: 1px solid #30303a;
    border-radius: 8px;

    background: #191921;
    color: white;
}

.quantity button:disabled {
    opacity: .3;
}

.quantity span {
    min-width: 20px;

    text-align: center;

    font-size: 13px;
}

.remove-item {
    border: none;

    background: none;

    color: #777;

    font-size: 11px;
}


/* =========================
   PROMO
========================= */

.promo {
    display: flex;

    gap: 8px;

    margin-top: 18px;
}

.promo input {
    flex: 1;

    min-width: 0;

    padding: 12px;

    border: 1px solid #292933;
    border-radius: 10px;

    background: #15151c;
    color: white;

    outline: none;
}

.promo button {
    padding: 0 15px;

    border: none;
    border-radius: 10px;

    background: #292933;
    color: white;
}

.promo-message {
    min-height: 17px;

    margin-top: 7px;

    font-size: 11px;
}

.promo-success {
    color: #6ee7b7;
}

.promo-error {
    color: #ff6b6b;
}


/* =========================
   SUMMARY
========================= */

.cart-summary {
    margin-top: 20px;

    padding-top: 16px;

    border-top: 1px solid #292933;
}

.summary-row {
    display: flex;

    justify-content: space-between;

    margin-bottom: 9px;

    color: #999;

    font-size: 13px;
}

.summary-total {
    display: flex;

    justify-content: space-between;

    margin-top: 15px;

    font-size: 20px;
    font-weight: bold;
}

.summary-discount {
    color: #6ee7b7;
}

.checkout-button {
    width: 100%;

    margin-top: 18px;

    padding: 14px;

    border: none;
    border-radius: 12px;

    background: #a855f7;
    color: white;

    font-size: 15px;
    font-weight: bold;
}


/* =========================
   TOAST
========================= */

.toast {
    position: fixed;

    left: 50%;
    bottom: 25px;

    z-index: 300;

    padding: 12px 17px;

    border-radius: 12px;

    background: #22222b;

    color: white;

    font-size: 13px;

    opacity: 0;

    transform: translate(-50%, 80px);

    transition: .3s;
}

.toast.show {
    opacity: 1;

    transform: translate(-50%, 0);
}


/* =========================
   DESKTOP
========================= */

@media (min-width: 900px) {

    body {
        max-width: 1400px;

        margin: 0 auto;

        padding: 30px;
    }

    .products {
        grid-template-columns:
            repeat(4, minmax(0, 1fr));
    }

    .product img {
        height: 300px;
    }

    .modal {
        align-items: center;
    }

    .modal-content {
        border-radius: 22px;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<header class="header">

    <div class="logo">

        <h1>MY STORE</h1>

        <p>CLOTHING & ACCESSORIES</p>

    </div>


    <button
        class="cart-button"
        onclick="openCart()"
    >

        🛒

        <span
            id="cartCount"
            class="cart-count hidden"
        >
            0
        </span>

    </button>

</header>


<!-- SEARCH -->

<div class="search">

    <input
        id="searchInput"
        type="text"
        placeholder="Поиск товара..."
    >

</div>


<!-- CATEGORIES -->

<div class="categories">

    <button
        class="category active"
        data-category="all"
    >
        ВСЕ
    </button>

    <button
        class="category"
        data-category="cat1"
    >
        1
    </button>

    <button
        class="category"
        data-category="cat2"
    >
        2
    </button>

    <button
        class="category"
        data-category="cat3"
    >
        3
    </button>

    <button
        class="category"
        data-category="cat4"
    >
        4
    </button>

</div>


<!-- SORT -->

<div class="sort-row">

    <select
        id="sortSelect"
        class="sort-select"
    >

        <option value="popular">
            Популярные
        </option>

        <option value="cheap">
            Сначала дешевле
        </option>

        <option value="expensive">
            Сначала дороже
        </option>

    </select>

</div>


<!-- PRODUCTS -->

<div
    id="products"
    class="products"
></div>


<div
    id="noResults"
    class="no-results"
>

    <div class="no-results-icon">
        🔎
    </div>

    <p>
        Ничего не найдено
    </p>

</div>


<!-- PRODUCT MODAL -->

<div
    id="productModal"
    class="modal"
>

    <div class="modal-content">

        <div class="modal-top">

            <h2 id="modalName"></h2>

            <button
                class="close"
                onclick="closeProductModal()"
            >
                ×
            </button>

        </div>


        <div class="gallery">

            <img
                id="modalImage"
                src=""
                alt=""
            >

            <button
                class="gallery-arrow gallery-prev"
                onclick="changeGallery(-1)"
            >
                ‹
            </button>

            <button
                class="gallery-arrow gallery-next"
                onclick="changeGallery(1)"
            >
                ›
            </button>

        </div>


        <div
            id="galleryDots"
            class="gallery-dots"
        ></div>


        <div
            id="modalDescription"
            style="
                margin-top:15px;
                color:#aaa;
                line-height:1.5;
                font-size:14px;
            "
        ></div>


        <div
            id="modalPrice"
            style="
                margin-top:15px;
                font-size:21px;
                font-weight:bold;
            "
        ></div>


        <div
            id="modalStock"
            style="
                margin-top:7px;
                color:#777;
                font-size:12px;
            "
        ></div>


        <div
            style="
                display:flex;
                align-items:center;
                gap:15px;
                margin-top:18px;
            "
        >

            <div class="quantity">

                <button
                    id="modalMinus"
                    onclick="changeModalQuantity(-1)"
                >
                    −
                </button>

                <span id="modalQuantity">
                    1
                </span>

                <button
                    id="modalPlus"
                    onclick="changeModalQuantity(1)"
                >
                    +
                </button>

            </div>


            <button
                id="modalAddButton"
                onclick="addCurrentProductToCart()"
                style="
                    flex:1;
                    padding:13px;
                    border:0;
                    border-radius:11px;
                    background:#a855f7;
                    color:white;
                    font-weight:bold;
                "
            >
                В корзину
            </button>

        </div>

    </div>

</div>


<!-- CART MODAL -->

<div
    id="cartModal"
    class="modal"
>

    <div class="modal-content">

        <div class="cart-header">

            <h2>
                Корзина
            </h2>

            <button
                class="close"
                onclick="closeCart()"
            >
                ×
            </button>

        </div>


        <div id="cartContent"></div>

    </div>

</div>


<div
    id="toast"
    class="toast"
></div>


<script src="products.js"></script>


<script>

/* =========================
   TELEGRAM
========================= */

const tg =
    window.Telegram.WebApp;

tg.ready();
tg.expand();


/* =========================
   STATE
========================= */

let currentCategory = "all";

let currentProduct = null;

let currentGalleryIndex = 0;

let modalQuantity = 1;

let cart = [];

let promoDiscount = 0;


/* =========================
   FORMAT PRICE
========================= */

function formatPrice(price) {

    return new Intl.NumberFormat(
        "ru-RU"
    ).format(price) + " ₽";

}


/* =========================
   CART STORAGE
========================= */

function saveCart() {

    localStorage.setItem(
        "myStoreCart",
        JSON.stringify(cart)
    );

}


function loadCart() {

    try {

        const saved =
            localStorage.getItem(
                "myStoreCart"
            );

        if (saved) {

            cart =
                JSON.parse(saved);

        }

    } catch {

        cart = [];

    }


    validateCartStock();

    saveCart();

    updateCartCount();

}


/* =========================
   STOCK
========================= */

function validateCartStock() {

    cart = cart.filter(item => {

        const product =
            products.find(
                p => p.id === item.id
            );

        if (!product)
            return false;

        if (product.stock <= 0)
            return false;

        if (
            item.quantity >
            product.stock
        ) {

            item.quantity =
                product.stock;

        }

        return true;

    });

}


/* =========================
   CATEGORY
========================= */

document
    .querySelectorAll(".category")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(
                        ".category"
                    )
                    .forEach(btn => {

                        btn.classList.remove(
                            "active"
                        );

                    });


                button.classList.add(
                    "active"
                );


                currentCategory =
                    button.dataset.category;


                renderProducts();

            }
        );

    });


/* =========================
   SEARCH
========================= */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        renderProducts
    );


/* =========================
   SORT
========================= */

document
    .getElementById(
        "sortSelect"
    )
    .addEventListener(
        "change",
        renderProducts
    );


/* =========================
   RENDER PRODUCTS
========================= */

function renderProducts() {

    const container =
        document.getElementById(
            "products"
        );

    const noResults =
        document.getElementById(
            "noResults"
        );


    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase()
            .trim();


    const sort =
        document
            .getElementById(
                "sortSelect"
            )
            .value;


    let filtered =
        products.filter(product => {

            const categoryMatch =
                currentCategory === "all" ||
                product.category ===
                    currentCategory;


            const searchMatch =
                search === "" ||

                product.name
                    .toLowerCase()
                    .includes(search) ||

                product.description
                    .toLowerCase()
                    .includes(search);


            return (
                categoryMatch &&
                searchMatch
            );

        });


    if (sort === "popular") {

        filtered.sort(
            (a, b) =>
                b.popularity -
                a.popularity
        );

    }


    if (sort === "cheap") {

        filtered.sort(
            (a, b) =>
                a.price -
                b.price
        );

    }


    if (sort === "expensive") {

        filtered.sort(
            (a, b) =>
                b.price -
                a.price
        );

    }


    container.innerHTML = "";


    if (
        filtered.length === 0
    ) {

        noResults.style.display =
            "block";

        return;

    }


    noResults.style.display =
        "none";


    filtered.forEach(
        product => {

            const soldOut =
                product.stock <= 0;


            const lowStock =
                product.stock > 0 &&
                product.stock <= 3;


            let stockText =
                "В НАЛИЧИИ";


            if (lowStock) {

                stockText =
                    `ОСТАЛОСЬ ${product.stock}`;

            }


            if (soldOut) {

                stockText =
                    "НЕТ В НАЛИЧИИ";

            }


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "product" +
                (
                    soldOut
                        ? " sold-out"
                        : ""
                );


            card.innerHTML = `

                <div
                    class="product-image"
                    onclick="openProduct(${product.id})"
                >

                    <img
                        src="${product.image}"
                        alt="${product.name}"
                    >

                    ${
                        product.sale
                            ? `
                                <div class="sale-badge">
                                    SALE
                                </div>
                              `
                            : ""
                    }

                    <div class="stock-badge">
                        ${stockText}
                    </div>

                    ${
                        soldOut
                            ? `
                                <div class="sold-overlay">
                                    НЕТ В НАЛИЧИИ
                                </div>
                              `
                            : ""
                    }

                </div>


                <h2>
                    ${product.name}
                </h2>


                <div class="price">

                    ${formatPrice(
                        product.price
                    )}

                    ${
                        product.oldPrice
                            ? `
                                <span class="old-price">
                                    ${formatPrice(
                                        product.oldPrice
                                    )}
                                </span>
                              `
                            : ""
                    }

                </div>


                <div class="product-stock">

                    ${
                        soldOut
                            ? "Товар закончился"
                            : `В наличии: ${product.stock} шт.`
                    }

                </div>


                <button
                    onclick="openProduct(${product.id})"
                    ${soldOut ? "disabled" : ""}
                >

                    ${
                        soldOut
                            ? "Нет в наличии"
                            : "Подробнее"
                    }

                </button>

            `;


            container.appendChild(
                card
            );

        }
    );

}


/* =========================
   PRODUCT
========================= */

function openProduct(id) {

    const product =
        products.find(
            p => p.id === id
        );


    if (!product)
        return;


    currentProduct =
        product;

    currentGalleryIndex =
        0;

    modalQuantity =
        1;


    document.getElementById(
        "modalName"
    ).textContent =
        product.name;


    document.getElementById(
        "modalDescription"
    ).textContent =
        product.description;


    document.getElementById(
        "modalPrice"
    ).textContent =
        formatPrice(
            product.price
        );


    updateGallery();

    updateModalQuantity();


    const stock =
        document.getElementById(
            "modalStock"
        );


    const button =
        document.getElementById(
            "modalAddButton"
        );


    if (product.stock <= 0) {

        stock.textContent =
            "Нет в наличии";

        button.disabled =
            true;

        button.textContent =
            "Нет в наличии";

        button.style.background =
            "#292933";

    } else {

        stock.textContent =
            `В наличии: ${product.stock} шт.`;

        button.disabled =
            false;

        button.textContent =
            "В корзину";

        button.style.background =
            "#a855f7";

    }


    document
        .getElementById(
            "productModal"
        )
        .classList.add(
            "active"
        );

}


function closeProductModal() {

    document
        .getElementById(
            "productModal"
        )
        .classList.remove(
            "active"
        );

    currentProduct =
        null;

}


/* =========================
   GALLERY
========================= */

function updateGallery() {

    if (!currentProduct)
        return;


    const gallery =
        currentProduct.gallery &&
        currentProduct.gallery.length
            ? currentProduct.gallery
            : [currentProduct.image];


    document.getElementById(
        "modalImage"
    ).src =
        gallery[
            currentGalleryIndex
        ];


    const dots =
        document.getElementById(
            "galleryDots"
        );


    dots.innerHTML = "";


    gallery.forEach(
        (_, index) => {

            const dot =
                document.createElement(
                    "button"
                );


            dot.className =
                "gallery-dot" +
                (
                    index ===
                    currentGalleryIndex
                        ? " active"
                        : ""
                );


            dot.onclick = () => {

                currentGalleryIndex =
                    index;

                updateGallery();

            };


            dots.appendChild(
                dot
            );

        }
    );

}


function changeGallery(direction) {

    if (!currentProduct)
        return;


    const gallery =
        currentProduct.gallery &&
        currentProduct.gallery.length
            ? currentProduct.gallery
            : [currentProduct.image];


    currentGalleryIndex +=
        direction;


    if (
        currentGalleryIndex <
        0
    ) {

        currentGalleryIndex =
            gallery.length - 1;

    }


    if (
        currentGalleryIndex >=
        gallery.length
    ) {

        currentGalleryIndex =
            0;

    }


    updateGallery();

}


/* =========================
   MODAL QUANTITY
========================= */

function updateModalQuantity() {

    document.getElementById(
        "modalQuantity"
    ).textContent =
        modalQuantity;


    const minus =
        document.getElementById(
            "modalMinus"
        );


    const plus =
        document.getElementById(
            "modalPlus"
        );


    if (!currentProduct)
        return;


    minus.disabled =
        modalQuantity <= 1;


    plus.disabled =
        modalQuantity >=
        currentProduct.stock;

}


function changeModalQuantity(
    change
) {

    if (!currentProduct)
        return;


    modalQuantity +=
        change;


    if (modalQuantity < 1) {

        modalQuantity = 1;

    }


    if (
        modalQuantity >
        currentProduct.stock
    ) {

        modalQuantity =
            currentProduct.stock;

    }


    updateModalQuantity();

}


/* =========================
   ADD TO CART
========================= */

function addCurrentProductToCart() {

    if (!currentProduct)
        return;


    if (
        currentProduct.stock <= 0
    )
        return;


    let item =
        cart.find(
            item =>
                item.id ===
                currentProduct.id
        );


    if (item) {

        item.quantity +=
            modalQuantity;


        if (
            item.quantity >
            currentProduct.stock
        ) {

            item.quantity =
                currentProduct.stock;

        }

    } else {

        cart.push({

            id:
                currentProduct.id,

            quantity:
                modalQuantity

        });

    }


    saveCart();

    updateCartCount();

    showToast(
        "Товар добавлен в корзину"
    );

    closeProductModal();

}


/* =========================
   CART COUNT
========================= */

function updateCartCount() {

    const count =
        cart.reduce(
            (sum, item) =>
                sum + item.quantity,
            0
        );


    const badge =
        document.getElementById(
            "cartCount"
        );


    badge.textContent =
        count;


    badge.classList.toggle(
        "hidden",
        count === 0
    );

}


/* =========================
   OPEN CART
========================= */

function openCart() {

    validateCartStock();

    saveCart();

    updateCartCount();

    renderCart();


    document
        .getElementById(
            "cartModal"
        )
        .classList.add(
            "active"
        );

}


function closeCart() {

    document
        .getElementById(
            "cartModal"
        )
        .classList.remove(
            "active"
        );

}


/* =========================
   CART
========================= */

function renderCart() {

    const container =
        document.getElementById(
            "cartContent"
        );


    if (cart.length === 0) {

        container.innerHTML = `

            <div class="cart-empty">

                <div class="cart-empty-icon">
                    🛒
                </div>

                <div>
                    Корзина пуста
                </div>

                <div
                    style="
                        margin-top:7px;
                        font-size:12px;
                    "
                >
                    Добавь что-нибудь из магазина
                </div>

            </div>

        `;

        return;

    }


    let html = `

        <button
            class="clear-cart"
            onclick="clearCart()"
        >
            Очистить корзину
        </button>

    `;


    cart.forEach(item => {

        const product =
            products.find(
                p => p.id === item.id
            );


        if (!product)
            return;


        const total =
            product.price *
            item.quantity;


        html += `

            <div class="cart-item">

                <img
                    src="${product.image}"
                    alt="${product.name}"
                >


                <div>

                    <div class="cart-item-name">
                        ${product.name}
                    </div>

                    <div class="cart-item-price">
                        ${formatPrice(product.price)}
                    </div>


                    <div class="quantity">

                        <button
                            onclick="changeCartQuantity(${product.id}, -1)"
                            ${
                                item.quantity <= 1
                                    ? "disabled"
                                    : ""
                            }
                        >
                            −
                        </button>

                        <span>
                            ${item.quantity}
                        </span>

                        <button
                            onclick="changeCartQuantity(${product.id}, 1)"
                            ${
                                item.quantity >= product.stock
                                    ? "disabled"
                                    : ""
                            }
                        >
                            +
                        </button>

                    </div>

                </div>


                <div>

                    <div class="cart-item-total">
                        ${formatPrice(total)}
                    </div>

                    <button
                        class="remove-item"
                        onclick="removeFromCart(${product.id})"
                    >
                        Удалить
                    </button>

                </div>

            </div>

        `;

    });


    const subtotal =
        calculateSubtotal();


    const discount =
        promoDiscount > 0
            ? Math.round(
                subtotal *
                promoDiscount /
                100
            )
            : 0;


    const total =
        subtotal -
        discount;


    html += `

        <div class="promo">

            <input
                id="promoInput"
                type="text"
                placeholder="Промокод"
            >

            <button
                onclick="applyPromo()"
            >
                Применить
            </button>

        </div>


        <div
            id="promoMessage"
            class="promo-message"
        ></div>


        <div class="cart-summary">

            <div class="summary-row">

                <span>
                    Товары
                </span>

                <span>
                    ${formatPrice(subtotal)}
                </span>

            </div>


            ${
                discount > 0
                    ? `
                        <div class="summary-row summary-discount">

                            <span>
                                Скидка
                            </span>

                            <span>
                                −${formatPrice(discount)}
                            </span>

                        </div>
                      `
                    : ""
            }


            <div class="summary-total">

                <span>
                    Итого
                </span>

                <span>
                    ${formatPrice(total)}
                </span>

            </div>


            <button
                class="checkout-button"
                onclick="checkout()"
            >
                Оформить заказ
            </button>

        </div>

    `;


    container.innerHTML =
        html;

}


function calculateSubtotal() {

    return cart.reduce(
        (sum, item) => {

            const product =
                products.find(
                    p => p.id === item.id
                );


            if (!product)
                return sum;


            return (
                sum +
                product.price *
                item.quantity
            );

        },
        0
    );

}


/* =========================
   CART QUANTITY
========================= */

function changeCartQuantity(
    productId,
    change
) {

    const item =
        cart.find(
            item =>
                item.id ===
                productId
        );


    const product =
        products.find(
            p =>
                p.id ===
                productId
        );


    if (!item || !product)
        return;


    item.quantity +=
        change;


    if (item.quantity <= 0) {

        cart =
            cart.filter(
                item =>
                    item.id !==
                    productId
            );

    }


    if (
        item.quantity >
        product.stock
    ) {

        item.quantity =
            product.stock;

    }


    saveCart();

    updateCartCount();

    renderCart();

}


function removeFromCart(
    productId
) {

    cart =
        cart.filter(
            item =>
                item.id !==
                productId
        );


    saveCart();

    updateCartCount();

    renderCart();

    showToast(
        "Товар удалён"
    );

}


function clearCart() {

    cart = [];

    promoDiscount = 0;

    saveCart();

    updateCartCount();

    renderCart();

    showToast(
        "Корзина очищена"
    );

}


/* =========================
   PROMO
========================= */

function applyPromo() {

    const input =
        document.getElementById(
            "promoInput"
        );


    const message =
        document.getElementById(
            "promoMessage"
        );


    if (!input || !message)
        return;


    const code =
        input.value
            .trim()
            .toUpperCase();


    if (code === "FIRST") {

        promoDiscount =
            10;


        message.textContent =
            "Промокод применён: −10%";


        message.className =
            "promo-message promo-success";


        renderCart();

    } else {

        promoDiscount =
            0;


        message.textContent =
            "Такого промокода нет";


        message.className =
            "promo-message promo-error";

    }

}


/* =========================
   CHECKOUT
========================= */

function checkout() {

    if (cart.length === 0) {

        showToast(
            "Корзина пуста"
        );

        return;

    }


    alert(
        "Оформление заказа пока находится в разработке."
    );

}


/* =========================
   TOAST
========================= */

let toastTimer;


function showToast(text) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        text;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            1800
        );

}


/* =========================
   CLOSE MODALS
========================= */

document
    .getElementById(
        "productModal"
    )
    .addEventListener(
        "click",
        event => {

            if (
                event.target.id ===
                "productModal"
            ) {

                closeProductModal();

            }

        }
    );


document
    .getElementById(
        "cartModal"
    )
    .addEventListener(
        "click",
        event => {

            if (
                event.target.id ===
                "cartModal"
            ) {

                closeCart();

            }

        }
    );


document.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Escape"
        ) {

            closeProductModal();

            closeCart();

        }

    }
);


/* =========================
   INIT
========================= */

loadCart();

renderProducts();

</script>
